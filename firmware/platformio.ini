; PlatformIO — Firmware ESP32 Bohemian Lab
; Contrôle plasma + acquisition pendule de torsion

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8      ; Client MQTT
    bblanchon/ArduinoJson@^7.0       ; Sérialisation JSON
    adafruit/Adafruit MAX31855@^1.3  ; Thermocouple
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
