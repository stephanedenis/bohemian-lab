<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 720" font-family="'Segoe UI', Arial, sans-serif" font-size="12">
  <rect width="660" height="720" fill="#ffffff"/>
  <defs>
    <linearGradient id="plasma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="grillage" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0h8M0 0v8" stroke="#78716c" stroke-width="0.8" fill="none"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Titre -->
  <text x="330" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Disposition interne de la chambre — Vue en coupe</text>
  <text x="330" y="42" text-anchor="middle" font-size="11" fill="#64748b">Chaudron ⌀250×250 mm · Fond en bas (sur plateau) · Ouverture en haut</text>

  <!--
       Layout vertical (y croissant = vers le bas du dessin) :
       y=55  : Connecteur pompage
       y=75  : Magnétron + capteurs (hors cage)
       y=130 : Grillage Faraday
       y=158 : Acrylique + DN10 + vanne
       y=188 : Joint silicone
       y=200 : Ouverture chambre (haut)
       y=205 : Parois chambre (w=300, h=300 → proportions ⌀250×250 carrées)
       y=505 : Fond inox
       y=535 : Légende

       Chambre : x=130..430 (w=300), y=205..505 (h=300) → carré ✓
  -->

  <!-- ============ ZONE 1 : MAGNÉTRON (au-dessus du grillage — HORS CAGE) ============ -->
  <rect x="130" y="55" width="300" height="70" rx="0" fill="#fff7ed" stroke="none"/>
  <line x1="130" y1="55" x2="130" y2="125" stroke="#ea580c" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="430" y1="55" x2="430" y2="125" stroke="#ea580c" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Magnétron -->
  <rect x="150" y="62" width="90" height="40" rx="5" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <text x="195" y="80" text-anchor="middle" font-size="11" fill="white" font-weight="bold">MAGNÉTRON</text>
  <text x="195" y="94" text-anchor="middle" font-size="9" fill="#fecaca">1 kW · 2,45 GHz</text>

  <!-- Antenne vers le bas (vers l'iris) -->
  <line x1="195" y1="102" x2="195" y2="118" stroke="#b91c1c" stroke-width="3"/>
  <polygon points="190,118 200,118 195,126" fill="#b91c1c"/>
  <text x="210" y="115" font-size="8" fill="#b91c1c">antenne ↓</text>

  <!-- Coupleur directionnel -->
  <rect x="265" y="67" width="70" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="80" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">Coupleur</text>
  <text x="300" y="90" text-anchor="middle" font-size="8" fill="#92400e">directionnel</text>

  <!-- Caméra Wi-Fi (remplace photodiode — vue plasma + Nixie à travers grillage) -->
  <rect x="355" y="67" width="62" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="386" y="80" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">📷 Caméra</text>
  <text x="386" y="90" text-anchor="middle" font-size="8" fill="#1d4ed8">Wi-Fi (plasma)</text>

  <!-- Annotation zone magnétron -->
  <line x1="435" y1="90" x2="460" y2="90" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="465" y="78" font-size="10" fill="#ea580c" font-weight="bold">← Au-dessus du grillage</text>
  <text x="465" y="90" font-size="10" fill="#ea580c">   HORS cage de Faraday</text>
  <text x="465" y="102" font-size="10" fill="#ea580c">   Pression atmosphérique</text>

  <!-- ===== VANNE + CONNECTEUR au-dessus du DN10 ===== -->
  <rect x="272" y="105" width="16" height="22" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  <rect x="265" y="92" width="30" height="15" rx="3" fill="#78716c" stroke="#334155" stroke-width="1.5"/>
  <text x="259" y="99" text-anchor="end" font-size="9" fill="#334155" font-weight="bold">Connecteur</text>
  <text x="259" y="110" text-anchor="end" font-size="9" fill="#334155">pompage ↕</text>

  <!-- ============ ZONE 2 : GRILLAGE FARADAY ============ -->
  <rect x="130" y="125" width="300" height="28" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <rect x="134" y="129" width="292" height="20" rx="2" fill="url(#grillage)" opacity="0.7"/>
  <text x="330" y="143" text-anchor="middle" font-size="10" fill="#334155" font-weight="bold">Grillage Faraday (maille &lt; 12 mm)</text>

  <!-- Fenêtre/iris dans le grillage -->
  <rect x="170" y="125" width="50" height="28" rx="2" fill="#fafaf9" stroke="#ea580c" stroke-width="2"/>
  <text x="195" y="143" text-anchor="middle" font-size="8" fill="#ea580c">iris ↓</text>

  <!-- Annotation grillage -->
  <line x1="435" y1="139" x2="460" y2="139" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="465" y="133" font-size="10" fill="#64748b">← Grillage Faraday</text>
  <text x="465" y="145" font-size="10" fill="#64748b">   sur l'acrylique</text>

  <!-- ============ ZONE 3 : COUVERCLE ACRYLIQUE ============ -->
  <rect x="130" y="153" width="300" height="28" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="350" y="170" text-anchor="middle" font-size="10" fill="#0c4a6e" font-weight="bold">ACRYLIQUE 3/4" (19 mm)</text>

  <!-- Vanne DN10 au centre du couvercle -->
  <rect x="253" y="148" width="54" height="38" rx="4" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
  <text x="280" y="165" text-anchor="middle" font-size="9" fill="white" font-weight="bold">VANNE</text>
  <text x="280" y="177" text-anchor="middle" font-size="9" fill="white">DN10</text>

  <!-- Annotation couvercle -->
  <line x1="435" y1="167" x2="460" y2="167" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="465" y="162" font-size="10" fill="#0284c7">← Couvercle acrylique</text>
  <text x="465" y="174" font-size="10" fill="#0284c7">   Vanne DN10 au centre</text>

  <!-- ============ JOINT SILICONE ============ -->
  <rect x="130" y="181" width="300" height="8" rx="2" fill="#fdba74" stroke="#ea580c" stroke-width="1"/>
  <text x="465" y="190" font-size="10" fill="#ea580c">← Joint silicone</text>

  <!-- ============ ZONE 4 : CHAMBRE INOX (⌀250×250 mm → carré 300×300 px) ============ -->
  <text x="280" y="200" text-anchor="middle" font-size="10" fill="#475569" font-weight="bold">↑ Ouverture en haut ↑</text>

  <!-- Parois inox (chambre carrée : 300×300 px pour ⌀250×250 mm) -->
  <rect x="130" y="205" width="300" height="300" rx="7" fill="none" stroke="#475569" stroke-width="4"/>
  <rect x="134" y="209" width="292" height="292" rx="5" fill="#f8fafc" stroke="none"/>

  <!-- Label paroi verticale -->
  <text x="80" y="340" font-size="10" fill="#475569" font-weight="bold" writing-mode="tb">Paroi inox (⌀250×250 mm)</text>

  <!-- Poignées chaudron -->
  <rect x="114" y="310" width="16" height="40" rx="5" fill="#a8a29e" stroke="#57534e" stroke-width="1.5"/>
  <rect x="430" y="310" width="16" height="40" rx="5" fill="#a8a29e" stroke="#57534e" stroke-width="1.5"/>
  <text x="105" y="302" font-size="8" fill="#57534e" text-anchor="end">Poignées</text>

  <!-- 8× Nixie IN-13 : 1 seule rangée, centrée en hauteur (en coupe, 1 tube visible par côté) -->
  <g fill="#ff6b2b" stroke="#cc4400" stroke-width="1.5" opacity="0.9">
    <rect x="142" y="310" width="10" height="90" rx="3"/>
    <rect x="408" y="310" width="10" height="90" rx="3"/>
  </g>
  <g fill="#ff6b2b" opacity="0.15" filter="url(#glow)">
    <rect x="142" y="310" width="10" height="90" rx="3"/>
    <rect x="408" y="310" width="10" height="90" rx="3"/>
  </g>

  <!-- Annotation Nixie -->
  <line x1="152" y1="310" x2="172" y2="297" stroke="#cc4400" stroke-width="1"/>
  <text x="175" y="295" font-size="10" fill="#cc4400" font-weight="bold">8× IN-13 néon (octogone, 45°)</text>
  <text x="175" y="307" font-size="9" fill="#cc4400">Mode passif · Broches à la masse · Lueur orange</text>

  <!-- Zone plasma (centrée verticalement dans la chambre) -->
  <rect x="170" y="300" width="220" height="170" rx="10" fill="url(#plasma)" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="280" y="370" text-anchor="middle" font-size="22" font-weight="bold" fill="#7c3aed" opacity="0.7">PLASMA H₂O</text>
  <text x="280" y="395" text-anchor="middle" font-size="14" fill="#7c3aed" opacity="0.6">2–5 mbar</text>
  <text x="280" y="415" text-anchor="middle" font-size="11" fill="#6d28d9" opacity="0.5">Volume ~ 11 L · sous vide</text>

  <!-- Thermocouple (paroi extérieure) -->
  <g transform="translate(430, 400)">
    <rect x="0" y="0" width="16" height="20" rx="3" fill="#14b8a6" stroke="#0d9488" stroke-width="1.5"/>
    <text x="23" y="10" font-size="9" fill="#0f766e" font-weight="bold">Thermocouple K</text>
    <text x="23" y="21" font-size="8" fill="#0f766e">(collé paroi ext.)</text>
  </g>

  <!-- Nixie passifs : broches à la masse (contact inox) -->
  <g font-size="8" fill="#cc4400">
    <text x="105" y="370" text-anchor="end">Broches</text>
    <text x="105" y="380" text-anchor="end">à la masse</text>
    <line x1="108" y1="372" x2="130" y2="372" stroke="#cc4400" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Fond du chaudron (en bas — repose sur le plateau) -->
  <rect x="130" y="505" width="300" height="10" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <text x="280" y="530" text-anchor="middle" font-size="10" fill="#475569" font-weight="bold">↓ Fond inox (repose sur le plateau porteur) ↓</text>

  <!-- Cotes ⌀250 horizontale et 250 verticale -->
  <g stroke="#475569" stroke-width="0.8" fill="#475569" font-size="8">
    <!-- Cote horizontale -->
    <line x1="130" y1="545" x2="430" y2="545" stroke-dasharray="3,2"/>
    <line x1="130" y1="540" x2="130" y2="550"/>
    <line x1="430" y1="540" x2="430" y2="550"/>
    <text x="280" y="555" text-anchor="middle" font-weight="bold">⌀ 250 mm</text>
    <!-- Cote verticale -->
    <line x1="460" y1="205" x2="460" y2="505" stroke-dasharray="3,2"/>
    <line x1="455" y1="205" x2="465" y2="205"/>
    <line x1="455" y1="505" x2="465" y2="505"/>
    <text x="470" y="360" font-weight="bold" writing-mode="tb">250 mm</text>
  </g>

  <!-- ============ LÉGENDE ============ -->
  <rect x="80" y="575" width="500" height="85" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="330" y="595" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Zones du montage (du bas vers le haut = fond → ouverture → extérieur)</text>

  <rect x="100" y="610" width="14" height="14" rx="2" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
  <text x="120" y="622" font-size="9" fill="#1e293b">Chambre inox (vide, RF ⚠️) + 8× Nixie IN-13</text>

  <rect x="100" y="633" width="14" height="14" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
  <text x="120" y="645" font-size="9" fill="#1e293b">Grillage Faraday (ferme la cage)</text>

  <rect x="340" y="610" width="14" height="14" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="360" y="622" font-size="9" fill="#1e293b">Acrylique + vanne DN10 + connecteur</text>

  <rect x="340" y="633" width="14" height="14" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="360" y="645" font-size="9" fill="#1e293b">📷 Caméra + coupleur + magnétron (hors cage)</text>
</svg>
