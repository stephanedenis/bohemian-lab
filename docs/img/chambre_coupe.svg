<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Segoe UI', Arial, sans-serif" font-size="12">
  <defs>
    <linearGradient id="plasma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="grillage" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0h8M0 0v8" stroke="#78716c" stroke-width="0.8" fill="none"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Titre -->
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Disposition interne de la chambre — Vue en coupe</text>

  <!-- Couvercle acrylique -->
  <rect x="110" y="40" width="340" height="28" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <rect x="115" y="44" width="330" height="20" rx="2" fill="url(#grillage)" opacity="0.6"/>
  <text x="280" y="57" text-anchor="middle" font-size="11" fill="#0c4a6e" font-weight="bold">Grillage Faraday (maille &lt; 12 mm)</text>

  <!-- Annotations couvercle -->
  <line x1="455" y1="54" x2="490" y2="54" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="495" y="50" font-size="10" fill="#64748b">← Couvercle acrylique</text>
  <text x="495" y="62" font-size="10" fill="#64748b">   3/4" (19 mm) + grillage</text>

  <!-- Paroi inox -->
  <rect x="100" y="68" width="360" height="370" rx="5" fill="none" stroke="#475569" stroke-width="4"/>
  <rect x="104" y="72" width="352" height="362" rx="3" fill="#f8fafc" stroke="none"/>

  <!-- Joint silicone -->
  <rect x="100" y="430" width="360" height="8" rx="2" fill="#fdba74" stroke="#ea580c" stroke-width="1"/>
  <text x="280" y="456" text-anchor="middle" font-size="10" fill="#9a3412">Joint silicone</text>

  <!-- Nixie IN-13 (gauche et droite) -->
  <g fill="#22c55e" stroke="#15803d" stroke-width="1.5" opacity="0.9">
    <rect x="115" y="90" width="12" height="120" rx="4"/>
    <rect x="115" y="230" width="12" height="120" rx="4"/>
    <rect x="433" y="90" width="12" height="120" rx="4"/>
    <rect x="433" y="230" width="12" height="120" rx="4"/>
  </g>
  <!-- Lueur Nixie -->
  <g fill="#22c55e" opacity="0.15" filter="url(#glow)">
    <rect x="115" y="90" width="12" height="120" rx="4"/>
    <rect x="115" y="230" width="12" height="120" rx="4"/>
    <rect x="433" y="90" width="12" height="120" rx="4"/>
    <rect x="433" y="230" width="12" height="120" rx="4"/>
  </g>

  <!-- Annotation Nixie -->
  <line x1="127" y1="100" x2="145" y2="85" stroke="#15803d" stroke-width="1"/>
  <text x="148" y="82" font-size="10" fill="#15803d" font-weight="bold">8× IN-13</text>
  <text x="148" y="93" font-size="9" fill="#15803d">(octogone, 45°)</text>

  <!-- Zone plasma -->
  <rect x="145" y="110" width="270" height="250" rx="10" fill="url(#plasma)" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="280" y="200" text-anchor="middle" font-size="20" font-weight="bold" fill="#7c3aed" opacity="0.7">PLASMA H₂O</text>
  <text x="280" y="225" text-anchor="middle" font-size="14" fill="#7c3aed" opacity="0.6">2–5 mbar</text>
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#6d28d9" opacity="0.5">Volume central ~ 11 L</text>

  <!-- Composants sur la paroi — côté droit -->
  <!-- Magnétron -->
  <g transform="translate(435, 140)">
    <rect x="0" y="0" width="18" height="40" rx="3" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="25" y="15" font-size="10" fill="#991b1b" font-weight="bold">Magnétron</text>
    <text x="25" y="27" font-size="9" fill="#991b1b">(sonde ou iris)</text>
    <line x1="0" y1="20" x2="-20" y2="20" stroke="#ef4444" stroke-width="2" marker-end="none"/>
    <polygon points="-20,16 -20,24 -28,20" fill="#ef4444"/>
  </g>

  <!-- Jauge Pirani -->
  <g transform="translate(435, 200)">
    <rect x="0" y="0" width="18" height="25" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="25" y="10" font-size="10" fill="#1e40af" font-weight="bold">Jauge Pirani</text>
    <text x="25" y="22" font-size="9" fill="#1e40af">(feedthrough paroi)</text>
  </g>

  <!-- Coupleur directionnel -->
  <g transform="translate(435, 245)">
    <rect x="0" y="0" width="18" height="25" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <text x="25" y="10" font-size="10" fill="#92400e" font-weight="bold">Coupleur directionnel</text>
    <text x="25" y="22" font-size="9" fill="#92400e">(P réfléchie)</text>
  </g>

  <!-- Photodiode -->
  <g transform="translate(435, 290)">
    <rect x="0" y="0" width="18" height="25" rx="3" fill="#8b5cf6" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="25" y="10" font-size="10" fill="#5b21b6" font-weight="bold">Photodiode BPW34</text>
    <text x="25" y="22" font-size="9" fill="#5b21b6">(face au plasma)</text>
  </g>

  <!-- Thermocouple -->
  <g transform="translate(435, 335)">
    <rect x="0" y="0" width="18" height="25" rx="3" fill="#14b8a6" stroke="#0d9488" stroke-width="1.5"/>
    <text x="25" y="10" font-size="10" fill="#0f766e" font-weight="bold">Thermocouple K</text>
    <text x="25" y="22" font-size="9" fill="#0f766e">(paroi extérieure)</text>
  </g>

  <!-- Vanne DN10 -->
  <g transform="translate(435, 385)">
    <rect x="0" y="0" width="18" height="30" rx="3" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="12" font-size="10" fill="#1e293b" font-weight="bold">Vanne DN10</text>
    <text x="25" y="24" font-size="9" fill="#1e293b">(pompage + injection H₂O)</text>
  </g>

  <!-- Note alimentation -->
  <rect x="90" y="470" width="380" height="40" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="280" y="486" text-anchor="middle" font-size="10" fill="#854d0e" font-weight="bold">⚡ Alimentation embarquée (batterie, onduleur, ESP32)</text>
  <text x="280" y="500" text-anchor="middle" font-size="10" fill="#854d0e">montée à l'EXTÉRIEUR de la chambre, solidaire du fléau</text>

  <!-- Légende paroi inox -->
  <line x1="96" y1="250" x2="70" y2="250" stroke="#475569" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="10" y="245" font-size="10" fill="#475569" font-weight="bold">Paroi</text>
  <text x="10" y="257" font-size="10" fill="#475569">inox</text>
</svg>
