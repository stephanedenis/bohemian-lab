<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" font-family="'Segoe UI', Arial, sans-serif" font-size="11">
  <defs>
    <marker id="fArr" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="fArrR" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="fArrG" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Titre -->
  <text x="350" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Matrice décisionnelle — Confirmer ou infirmer</text>

  <!-- Q1: Nixie symétriques? -->
  <rect x="220" y="45" width="200" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Nixie symétriques ?</text>
  <text x="320" y="80" text-anchor="middle" font-size="9" fill="#3b82f6">(8 colonnes de même longueur)</text>

  <!-- OUI → droite → Q2 force mesurée? -->
  <line x1="420" y1="67" x2="475" y2="67" stroke="#16a34a" stroke-width="2" marker-end="url(#fArrG)"/>
  <text x="448" y="60" font-size="10" font-weight="bold" fill="#16a34a">OUI</text>

  <rect x="485" y="45" width="160" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="565" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Force mesurée ?</text>

  <!-- OUI → NULL non conforme -->
  <line x1="645" y1="67" x2="680" y2="67" stroke="#dc2626" stroke-width="2"/>
  <!-- NON → NULL conforme -->
  <text x="660" y="60" font-size="10" font-weight="bold" fill="#dc2626">NON</text>
  <rect x="570" y="110" width="115" height="35" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="627" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">NULL (conforme)</text>
  <line x1="565" y1="89" x2="565" y2="110" stroke="#16a34a" stroke-width="2" marker-end="url(#fArrG)"/>
  <text x="575" y="102" font-size="9" fill="#16a34a">NON</text>

  <!-- OUI vers le bas → artefact -->
  <line x1="565" y1="89" x2="565" y2="89" stroke="#dc2626" stroke-width="2"/>
  <rect x="485" y="155" width="170" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="570" y="173" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="bold">ARTEFACT probable</text>
  <text x="570" y="190" text-anchor="middle" font-size="9" fill="#991b1b">(force sans gradient)</text>

  <!-- Force OUI → artefact -->
  <line x1="627" y1="89" x2="627" y2="155" stroke="#dc2626" stroke-width="2" marker-end="url(#fArrR)"/>
  <text x="638" y="125" font-size="9" font-weight="bold" fill="#dc2626">OUI</text>

  <!-- NON ↓ (Nixie asymétriques) -->
  <line x1="320" y1="89" x2="320" y2="135" stroke="#dc2626" stroke-width="2" marker-end="url(#fArr)"/>
  <text x="332" y="115" font-size="10" font-weight="bold" fill="#dc2626">NON</text>

  <!-- Q2: Gradient visible -->
  <rect x="220" y="135" width="200" height="38" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="159" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">Gradient visible</text>

  <!-- ↓ -->
  <line x1="320" y1="173" x2="320" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#fArr)"/>

  <!-- Q3: corrèle avec force? -->
  <rect x="195" y="215" width="250" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Gradient corrèle avec</text>
  <text x="320" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">la direction de la force ?</text>

  <!-- NON → droite → Coïncidence -->
  <line x1="445" y1="237" x2="495" y2="237" stroke="#dc2626" stroke-width="2" marker-end="url(#fArrR)"/>
  <text x="465" y="230" font-size="10" font-weight="bold" fill="#dc2626">NON</text>
  <rect x="505" y="219" width="160" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="585" y="241" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="bold">Coïncidence / artefact</text>

  <!-- OUI ↓ -->
  <line x1="320" y1="259" x2="320" y2="305" stroke="#16a34a" stroke-width="2" marker-end="url(#fArr)"/>
  <text x="332" y="285" font-size="10" font-weight="bold" fill="#16a34a">OUI</text>

  <!-- Q4: Inversion 180°? -->
  <rect x="220" y="305" width="200" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="329" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Inversion 180° OK ?</text>

  <!-- NON → droite → Artefact directionnel -->
  <line x1="420" y1="324" x2="495" y2="324" stroke="#dc2626" stroke-width="2" marker-end="url(#fArrR)"/>
  <text x="455" y="317" font-size="10" font-weight="bold" fill="#dc2626">NON</text>
  <rect x="505" y="306" width="160" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="585" y="328" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="bold">Artefact directionnel</text>

  <!-- OUI ↓ -->
  <line x1="320" y1="343" x2="320" y2="390" stroke="#16a34a" stroke-width="2" marker-end="url(#fArr)"/>
  <text x="332" y="370" font-size="10" font-weight="bold" fill="#16a34a">OUI</text>

  <!-- Q5: Argon négatif? -->
  <rect x="220" y="390" width="200" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Argon négatif ?</text>

  <!-- NON → droite → Effet non spécifique -->
  <line x1="420" y1="409" x2="495" y2="409" stroke="#dc2626" stroke-width="2" marker-end="url(#fArrR)"/>
  <text x="455" y="402" font-size="10" font-weight="bold" fill="#dc2626">NON</text>
  <rect x="505" y="391" width="170" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="590" y="408" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="bold">Effet non spécifique</text>
  <text x="590" y="422" text-anchor="middle" font-size="9" fill="#991b1b">au H₂O</text>

  <!-- OUI ↓ -->
  <line x1="320" y1="428" x2="320" y2="475" stroke="#16a34a" stroke-width="2" marker-end="url(#fArr)"/>
  <text x="332" y="455" font-size="10" font-weight="bold" fill="#16a34a">OUI</text>

  <!-- Q6: Charge fantôme? -->
  <rect x="195" y="475" width="250" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="499" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Charge fantôme négative ?</text>

  <!-- NON → droite → Effet thermique -->
  <line x1="445" y1="494" x2="495" y2="494" stroke="#dc2626" stroke-width="2" marker-end="url(#fArrR)"/>
  <text x="465" y="487" font-size="10" font-weight="bold" fill="#dc2626">NON</text>
  <rect x="505" y="476" width="160" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="585" y="498" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="bold">Effet thermique pur</text>

  <!-- OUI ↓ -->
  <line x1="320" y1="513" x2="320" y2="560" stroke="#16a34a" stroke-width="2" marker-end="url(#fArrG)"/>
  <text x="332" y="540" font-size="10" font-weight="bold" fill="#16a34a">OUI</text>

  <!-- RÉSULTAT FINAL ✅ -->
  <rect x="180" y="560" width="280" height="55" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="320" y="585" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">✅ CANDIDAT POUR</text>
  <text x="320" y="605" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">EFFET BOHMIEN</text>

  <!-- Note -->
  <rect x="180" y="625" width="280" height="22" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="320" y="641" text-anchor="middle" font-size="9" fill="#4338ca">→ Publier + inviter réplication indépendante</text>

  <!-- Barre latérale : chaque NON = disqualification -->
  <text x="590" y="470" font-size="9" fill="#64748b" transform="rotate(-90, 590, 470)">Chaque NON élimine l'hypothèse</text>
</svg>
