<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700"
     font-family="'Segoe UI', Arial, sans-serif" font-size="11">
  <title>Circuit HV — Alimentation magnétron 2M213-01TAG (symboles IEC 60617)</title>
  <rect width="880" height="700" fill="#ffffff"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>

    <!-- ═══ Symbole terre châssis IEC 60417-5020 ═══ -->
    <g id="sym-chassis">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#334155" stroke-width="2"/>
      <line x1="-10" y1="7" x2="10" y2="7" stroke="#334155" stroke-width="2"/>
      <line x1="-10" y1="7" x2="-14" y2="15" stroke="#334155" stroke-width="1.5"/>
      <line x1="-3" y1="7" x2="-7" y2="15" stroke="#334155" stroke-width="1.5"/>
      <line x1="4" y1="7" x2="0" y2="15" stroke="#334155" stroke-width="1.5"/>
    </g>
    <!-- Nœud de jonction -->
    <circle id="dot" r="3.5" fill="#334155"/>

    <!-- ═══ Symbole source AC IEC (cercle + sinus) ═══ -->
    <g id="sym-ac">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#334155" stroke-width="2"/>
      <path d="M-11,0 Q-6,-14 0,0 Q6,14 11,0" stroke="#334155" stroke-width="1.8" fill="none"/>
    </g>

    <!-- ═══ Bobine IEC (demi-arcs verticaux) — primaire ═══ -->
    <g id="coil-pri">
      <path d="M0,0 A8,8 0 0,1 0,16" stroke="#dc2626" stroke-width="2.2" fill="none"/>
      <path d="M0,16 A8,8 0 0,1 0,32" stroke="#dc2626" stroke-width="2.2" fill="none"/>
      <path d="M0,32 A8,8 0 0,1 0,48" stroke="#dc2626" stroke-width="2.2" fill="none"/>
      <path d="M0,48 A8,8 0 0,1 0,64" stroke="#dc2626" stroke-width="2.2" fill="none"/>
    </g>

    <!-- ═══ Bobine IEC — secondaire HT (plus de spires) ═══ -->
    <g id="coil-sec">
      <path d="M0,0 A7,7 0 0,0 0,12" stroke="#7c2d12" stroke-width="2.4" fill="none"/>
      <path d="M0,12 A7,7 0 0,0 0,24" stroke="#7c2d12" stroke-width="2.4" fill="none"/>
      <path d="M0,24 A7,7 0 0,0 0,36" stroke="#7c2d12" stroke-width="2.4" fill="none"/>
      <path d="M0,36 A7,7 0 0,0 0,48" stroke="#7c2d12" stroke-width="2.4" fill="none"/>
      <path d="M0,48 A7,7 0 0,0 0,60" stroke="#7c2d12" stroke-width="2.4" fill="none"/>
      <path d="M0,60 A7,7 0 0,0 0,72" stroke="#7c2d12" stroke-width="2.4" fill="none"/>
      <path d="M0,72 A7,7 0 0,0 0,84" stroke="#7c2d12" stroke-width="2.4" fill="none"/>
    </g>

    <!-- ═══ Bobine IEC — secondaire filament (petite) ═══ -->
    <g id="coil-fil">
      <path d="M0,0 A6,6 0 0,0 0,12" stroke="#ea580c" stroke-width="2" fill="none"/>
      <path d="M0,12 A6,6 0 0,0 0,24" stroke="#ea580c" stroke-width="2" fill="none"/>
    </g>

    <!-- ═══ Diode IEC 60617 (triangle + barre) ═══ -->
    <g id="sym-diode">
      <polygon points="-12,0 12,0 0,24" fill="none" stroke="#334155" stroke-width="2"/>
      <line x1="-12" y1="24" x2="12" y2="24" stroke="#334155" stroke-width="2.5"/>
    </g>

    <!-- ═══ Condensateur IEC 60617 (deux plaques) ═══ -->
    <g id="sym-cap">
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#334155" stroke-width="2.5"/>
      <line x1="-16" y1="8" x2="16" y2="8" stroke="#334155" stroke-width="2.5"/>
    </g>

    <!-- ═══ Résistance IEC 60617 (rectangle) ═══ -->
    <g id="sym-res">
      <rect x="-6" y="0" width="12" height="36" fill="none" stroke="#334155" stroke-width="1.8"/>
    </g>

    <!-- ═══ SSR IEC — relais statique (optocoupleur) ═══ -->
    <g id="sym-ssr">
      <rect x="0" y="0" width="70" height="60" fill="none" stroke="#334155" stroke-width="2"/>
      <!-- LED (triangle émetteur) -->
      <polygon points="12,18 12,42 28,30" fill="none" stroke="#16a34a" stroke-width="1.5"/>
      <!-- Flèches photons -->
      <line x1="24" y1="22" x2="32" y2="16" stroke="#16a34a" stroke-width="1"/>
      <line x1="29" y1="16" x2="32" y2="16" stroke="#16a34a" stroke-width="1"/>
      <line x1="32" y1="16" x2="32" y2="19" stroke="#16a34a" stroke-width="1"/>
      <line x1="24" y1="28" x2="32" y2="22" stroke="#16a34a" stroke-width="1"/>
      <line x1="29" y1="22" x2="32" y2="22" stroke="#16a34a" stroke-width="1"/>
      <line x1="32" y1="22" x2="32" y2="25" stroke="#16a34a" stroke-width="1"/>
      <!-- Triac (deux triangles tête-bêche) -->
      <polygon points="42,18 42,42 56,30" fill="none" stroke="#334155" stroke-width="1.5"/>
      <polygon points="56,18 56,42 42,30" fill="none" stroke="#334155" stroke-width="1.5"/>
      <!-- Barrière d'isolation -->
      <line x1="35" y1="10" x2="35" y2="50" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    </g>

    <!-- ═══ Magnétron — symbole tube à vide IEC ═══ -->
    <g id="sym-magnetron">
      <!-- Enveloppe tube à vide (cercle) -->
      <circle cx="0" cy="0" r="40" fill="none" stroke="#334155" stroke-width="2.5"/>
      <!-- Cathode (filament en W) -->
      <path d="M-14,-6 L-7,6 L0,-6 L7,6 L14,-6" stroke="#f97316" stroke-width="2" fill="none"/>
      <!-- Anode segmentée (6 cavités résonantes, arcs) -->
      <g stroke="#334155" stroke-width="1.8" fill="none">
        <path d="M-28,-24 A6,6 0 0,1 -18,-30"/>
        <path d="M-8,-32 A6,6 0 0,1 8,-32"/>
        <path d="M18,-30 A6,6 0 0,1 28,-24"/>
        <path d="M32,-12 A6,6 0 0,1 32,12"/>
        <path d="M28,24 A6,6 0 0,1 18,30"/>
        <path d="M-18,30 A6,6 0 0,1 -28,24"/>
      </g>
      <!-- Champ magnétique (arcs IEC aimant permanent) -->
      <path d="M-48,-14 A10,18 0 0,0 -48,14" stroke="#6366f1" stroke-width="1.5" fill="none"/>
      <path d="M48,-14 A10,18 0 0,1 48,14" stroke="#6366f1" stroke-width="1.5" fill="none"/>
      <text x="-56" y="4" text-anchor="end" font-size="8" fill="#6366f1" font-style="italic">B</text>
      <text x="56" y="4" font-size="8" fill="#6366f1" font-style="italic">B</text>
    </g>
  </defs>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- TITRE                                                    -->
  <!-- ════════════════════════════════════════════════════════ -->
  <text x="440" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">
    Circuit HV — Alimentation magnétron 2M213-01TAG
  </text>
  <text x="440" y="44" text-anchor="middle" font-size="11" fill="#64748b">
    MOT + doubleur Villard · Commande SSR zero-crossing · Symboles IEC 60617
  </text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- SOURCE AC 120 V                                          -->
  <!-- ════════════════════════════════════════════════════════ -->
  <use href="#sym-ac" x="80" y="250"/>
  <text x="80" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#0c4a6e">120 V AC</text>
  <text x="80" y="222" text-anchor="middle" font-size="10" fill="#0369a1">60 Hz</text>
  <!-- Borne L (haut) -->
  <line x1="80" y1="228" x2="80" y2="160" stroke="#dc2626" stroke-width="2.2"/>
  <text x="72" y="200" font-size="9" fill="#dc2626" font-weight="bold">L</text>
  <!-- Borne N (bas) -->
  <line x1="80" y1="272" x2="80" y2="370" stroke="#2563eb" stroke-width="2"/>
  <text x="72" y="310" font-size="9" fill="#2563eb" font-weight="bold">N</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- BUS L et N                                               -->
  <!-- ════════════════════════════════════════════════════════ -->
  <line x1="80" y1="160" x2="180" y2="160" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="80" y1="370" x2="300" y2="370" stroke="#2563eb" stroke-width="2"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- SSR — Relais statique IEC                                -->
  <!-- ════════════════════════════════════════════════════════ -->
  <use href="#sym-ssr" x="180" y="130"/>
  <text x="215" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">SSR</text>
  <text x="215" y="202" text-anchor="middle" font-size="9" fill="#16a34a">25 A · ZC</text>

  <!-- Commande ESP32 → LED du SSR -->
  <line x1="192" y1="130" x2="192" y2="85" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="160" y="58" width="80" height="26" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="200" y="76" text-anchor="middle" font-size="10" fill="#4338ca" font-weight="bold">ESP32 GPIO</text>
  <text x="252" y="98" font-size="9" fill="#16a34a">PWM duty 0–100 %</text>
  <text x="252" y="110" font-size="9" fill="#16a34a">Zero-crossing</text>

  <!-- Sortie SSR → MOT primaire -->
  <line x1="250" y1="160" x2="300" y2="160" stroke="#dc2626" stroke-width="2.2"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- MOT — Transformateur IEC 60617                           -->
  <!--    Bobines demi-arcs + noyau fer (2 traits)              -->
  <!-- ════════════════════════════════════════════════════════ -->
  <text x="340" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">MOT</text>
  <text x="340" y="115" text-anchor="middle" font-size="9" fill="#ea580c">(Microwave Oven Transformer)</text>

  <!-- Primaire IEC (demi-arcs gauche du noyau) -->
  <use href="#coil-pri" x="300" y="160"/>
  <!-- Point de polarité primaire -->
  <circle cx="296" cy="166" r="2.5" fill="#334155"/>
  <!-- Labels -->
  <text x="280" y="185" text-anchor="end" font-size="9" fill="#dc2626">120 V</text>
  <text x="280" y="197" text-anchor="end" font-size="9" fill="#dc2626">~5 A</text>
  <text x="280" y="230" text-anchor="end" font-size="9" fill="#64748b">PRI</text>

  <!-- Noyau fer IEC (2 traits verticaux) -->
  <line x1="314" y1="148" x2="314" y2="390" stroke="#44403c" stroke-width="3"/>
  <line x1="322" y1="148" x2="322" y2="390" stroke="#44403c" stroke-width="3"/>

  <!-- Secondaire HT IEC (demi-arcs droite du noyau) -->
  <use href="#coil-sec" x="336" y="160"/>
  <!-- Point de polarité secondaire -->
  <circle cx="340" cy="166" r="2.5" fill="#334155"/>
  <!-- Labels -->
  <text x="358" y="175" font-size="9" fill="#7c2d12" font-weight="bold">~2 100 V</text>
  <text x="358" y="187" font-size="9" fill="#7c2d12">AC</text>
  <text x="358" y="250" font-size="9" fill="#64748b">SEC HT</text>

  <!-- Secondaire filament IEC -->
  <use href="#coil-fil" x="336" y="310"/>
  <text x="358" y="322" font-size="9" fill="#ea580c">3,15 V</text>
  <text x="358" y="336" font-size="9" fill="#ea580c">@ 10 A</text>
  <text x="358" y="350" font-size="9" fill="#64748b">FIL</text>

  <!-- Connexions primaire -->
  <!-- N → Primaire bas -->
  <line x1="300" y1="224" x2="300" y2="370" stroke="#2563eb" stroke-width="2"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- DOUBLEUR VILLARD — cadre                                 -->
  <!-- ════════════════════════════════════════════════════════ -->
  <rect x="420" y="92" width="310" height="290" rx="0"
        fill="none" stroke="#991b1b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="575" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">
    Doubleur de tension Villard
  </text>

  <!-- Fil sec HT haut → nœud A -->
  <line x1="336" y1="160" x2="500" y2="160" stroke="#7c2d12" stroke-width="2"/>
  <use href="#dot" x="500" y="160"/>

  <!-- ═══ Diode HV IEC ═══ -->
  <g transform="translate(500,165)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#334155" stroke-width="2"/>
    <use href="#sym-diode" x="0" y="8"/>
    <line x1="0" y1="32" x2="0" y2="42" stroke="#334155" stroke-width="2"/>
    <!-- Label -->
    <text x="20" y="12" font-size="9" fill="#991b1b" font-weight="bold">D₁</text>
    <text x="20" y="24" font-size="8" fill="#991b1b">CL01-12</text>
    <text x="20" y="36" font-size="8" fill="#991b1b">12 kV PIV</text>
  </g>

  <!-- Nœud B sous diode -->
  <use href="#dot" x="500" y="255"/>

  <!-- ═══ Condensateur HV IEC ═══ -->
  <g transform="translate(500,255)">
    <!-- Fil horizontal vers la droite -->
    <line x1="0" y1="0" x2="60" y2="0" stroke="#334155" stroke-width="2"/>
    <!-- Condensateur IEC (2 plaques verticales) -->
    <g transform="translate(60,0)">
      <use href="#sym-cap" x="0" y="-4"/>
      <!-- Fil de sortie -->
      <line x1="0" y1="4" x2="0" y2="20" stroke="#334155" stroke-width="2"/>
      <line x1="0" y1="20" x2="80" y2="20" stroke="#334155" stroke-width="2"/>
    </g>
    <!-- Labels -->
    <text x="60" y="-14" text-anchor="middle" font-size="9" fill="#334155" font-weight="bold">C₁</text>
    <text x="60" y="24" text-anchor="middle" font-size="8" fill="#475569">1 µF · 2 100 V AC</text>
  </g>

  <!-- Nœud C (sortie -4 kV) -->
  <use href="#dot" x="640" y="275"/>

  <!-- Fil sec HT bas → masse doubleur -->
  <line x1="336" y1="244" x2="420" y2="244" stroke="#7c2d12" stroke-width="2"/>
  <line x1="420" y1="244" x2="420" y2="345" stroke="#334155" stroke-width="2"/>

  <!-- Nœud B → masse -->
  <line x1="500" y1="255" x2="500" y2="345" stroke="#334155" stroke-width="2"/>

  <!-- Barre de masse doubleur -->
  <line x1="410" y1="345" x2="660" y2="345" stroke="#334155" stroke-width="2.5"/>
  <use href="#dot" x="420" y="345"/>
  <use href="#dot" x="500" y="345"/>
  <use href="#dot" x="640" y="345"/>
  <use href="#sym-chassis" x="530" y="345"/>
  <text x="548" y="370" font-size="9" fill="#334155" font-weight="bold">CHÂSSIS / ANODE</text>

  <!-- ═══ Résistance de décharge (bleeder) IEC ═══ -->
  <g transform="translate(640,275)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#64748b" stroke-width="1.5"/>
    <use href="#sym-res" x="0" y="10"/>
    <line x1="0" y1="46" x2="0" y2="70" stroke="#64748b" stroke-width="1.5"/>
    <text x="14" y="25" font-size="8" fill="#64748b">R_bleed</text>
    <text x="14" y="37" font-size="8" fill="#64748b">10 MΩ</text>
  </g>

  <!-- Sortie -4 kV →  cathode magnétron -->
  <line x1="640" y1="275" x2="700" y2="275" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="700" y1="275" x2="700" y2="430" stroke="#dc2626" stroke-width="2.5"/>

  <!-- Annotation tension -->
  <rect x="710" y="286" width="110" height="48" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="765" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">−4 000 V DC</text>
  <text x="765" y="318" text-anchor="middle" font-size="9" fill="#dc2626">sur cathode</text>
  <text x="765" y="330" text-anchor="middle" font-size="9" fill="#dc2626">≈ 300 mA crête</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- MAGNÉTRON — Tube à vide IEC                              -->
  <!-- ════════════════════════════════════════════════════════ -->
  <use href="#sym-magnetron" x="700" y="480"/>
  <text x="700" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">2M213-01TAG</text>
  <text x="700" y="550" text-anchor="middle" font-size="10" fill="#c2410c">~700 W · 2,45 GHz</text>

  <!-- Cathode → HV (fil vers haut) -->
  <line x1="700" y1="430" x2="700" y2="440" stroke="#dc2626" stroke-width="2.5"/>

  <!-- Anode (masse) → chassis -->
  <line x1="700" y1="520" x2="700" y2="560" stroke="#334155" stroke-width="2"/>
  <use href="#sym-chassis" x="700" y="560"/>

  <!-- Filament → magnétron -->
  <line x1="336" y1="310" x2="370" y2="310" stroke="#ea580c" stroke-width="2"/>
  <line x1="370" y1="310" x2="370" y2="470" stroke="#ea580c" stroke-width="2"/>
  <line x1="370" y1="470" x2="656" y2="470" stroke="#ea580c" stroke-width="2"/>
  <line x1="336" y1="334" x2="382" y2="334" stroke="#ea580c" stroke-width="2"/>
  <line x1="382" y1="334" x2="382" y2="490" stroke="#ea580c" stroke-width="2"/>
  <line x1="382" y1="490" x2="656" y2="490" stroke="#ea580c" stroke-width="2"/>
  <text x="510" y="464" text-anchor="middle" font-size="9" fill="#ea580c" font-weight="bold">
    Filament 3,15 V AC @ 10 A
  </text>
  <text x="510" y="504" text-anchor="middle" font-size="8" fill="#ea580c">
    ⚠ au potentiel cathode (−4 kV)
  </text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- SORTIE RF — symbole antenne IEC                          -->
  <!-- ════════════════════════════════════════════════════════ -->
  <g transform="translate(800,440)">
    <line x1="0" y1="40" x2="0" y2="10" stroke="#7c3aed" stroke-width="2.5"/>
    <line x1="-12" y1="10" x2="0" y2="-6" stroke="#7c3aed" stroke-width="2"/>
    <line x1="12" y1="10" x2="0" y2="-6" stroke="#7c3aed" stroke-width="2"/>
    <text x="22" y="14" font-size="10" fill="#7c3aed" font-weight="bold">RF</text>
    <text x="22" y="28" font-size="9" fill="#7c3aed">2,45 GHz</text>
    <text x="22" y="42" font-size="9" fill="#7c3aed">→ iris</text>
    <text x="22" y="56" font-size="9" fill="#7c3aed">→ chambre</text>
  </g>
  <line x1="700" y1="440" x2="700" y2="430" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="740" y1="470" x2="800" y2="470" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <text x="770" y="462" text-anchor="middle" font-size="8" fill="#7c3aed">~200–400 W eff.</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- ANNOTATIONS SÉCURITÉ                                     -->
  <!-- ════════════════════════════════════════════════════════ -->
  <rect x="30" y="590" width="380" height="100" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="220" y="613" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">⚠ SÉCURITÉ — HAUTE TENSION</text>
  <g font-size="10" fill="#991b1b">
    <text x="45" y="633">• Tension mortelle : 4 000 V DC @ 300 mA</text>
    <text x="45" y="650">• Énergie stockée : ½C₁V² ≈ 8 J</text>
    <text x="45" y="667">• R_bleed : décharge auto ~30 s</text>
    <text x="45" y="684">• Toujours vérifier V = 0 avant intervention</text>
  </g>

  <!-- Notes SSR -->
  <rect x="440" y="590" width="260" height="100" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570" y="613" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Commande SSR</text>
  <g font-size="9" fill="#166534">
    <text x="455" y="633">• Résolution : ~10 % / fenêtre 16,7 ms</text>
    <text x="455" y="650">• Latence : &lt; 16,7 ms (1 cycle 60 Hz)</text>
    <text x="455" y="667">• Pas d'harmoniques → pas de mode-hopping</text>
    <text x="455" y="684">• Watchdog ESP32 : coupure si anomalie</text>
  </g>
</svg>
