<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="'Segoe UI', Arial, sans-serif" font-size="11">
  <rect width="800" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2563eb"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Titre -->
  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Circuit HV — Alimentation magnétron 2M213-01TAG</text>
  <text x="400" y="44" text-anchor="middle" font-size="11" fill="#64748b">MOT + doubleur de tension · Commande SSR zero-crossing sur primaire 120 V AC</text>

  <!-- ============ SECTEUR 120V AC ============ -->
  <rect x="30" y="180" width="90" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="75" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#0c4a6e">120 V AC</text>
  <text x="75" y="220" text-anchor="middle" font-size="10" fill="#0369a1">60 Hz</text>

  <!-- Fil L (phase) -->
  <line x1="120" y1="195" x2="170" y2="195" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="145" y="188" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="bold">L</text>

  <!-- Fil N (neutre) -->
  <line x1="120" y1="225" x2="250" y2="225" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="145" y="238" text-anchor="middle" font-size="9" fill="#2563eb" font-weight="bold">N</text>

  <!-- ============ SSR ZERO-CROSSING ============ -->
  <rect x="175" y="175" width="70" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="210" y="195" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">SSR</text>
  <text x="210" y="207" text-anchor="middle" font-size="8" fill="#16a34a">25 A / ZC</text>

  <!-- Ligne commande ESP32 vers SSR -->
  <line x1="210" y1="175" x2="210" y2="125" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="170" y="95" width="80" height="28" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="210" y="113" text-anchor="middle" font-size="10" fill="#4338ca" font-weight="bold">ESP32 GPIO</text>
  <line x1="210" y1="123" x2="210" y2="125" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="260" y="140" font-size="9" fill="#16a34a">PWM duty</text>
  <text x="260" y="152" font-size="9" fill="#16a34a">0–100 % ZC</text>

  <!-- Sortie SSR vers MOT primaire -->
  <line x1="245" y1="195" x2="310" y2="195" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>

  <!-- ============ TRANSFORMATEUR MOT ============ -->
  <rect x="310" y="140" width="140" height="160" rx="8" fill="#fef7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="380" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">MOT</text>
  <text x="380" y="177" text-anchor="middle" font-size="9" fill="#ea580c">(Microwave Oven Transformer)</text>

  <!-- Primaire (bobine gauche) -->
  <g transform="translate(330, 195)">
    <path d="M0,0 C8,-12 22,-12 30,0 C38,-12 52,-12 60,0" stroke="#dc2626" stroke-width="2" fill="none"/>
    <path d="M0,10 C8,-2 22,-2 30,10 C38,-2 52,-2 60,10" stroke="#dc2626" stroke-width="2" fill="none"/>
    <path d="M0,20 C8,8 22,8 30,20 C38,8 52,8 60,20" stroke="#dc2626" stroke-width="2" fill="none"/>
    <text x="30" y="38" text-anchor="middle" font-size="9" fill="#dc2626">Primaire</text>
    <text x="30" y="50" text-anchor="middle" font-size="9" fill="#dc2626">120 V · ~5 A</text>
  </g>

  <!-- Noyau fer (trait double vertical) -->
  <line x1="373" y1="185" x2="373" y2="290" stroke="#44403c" stroke-width="3"/>
  <line x1="387" y1="185" x2="387" y2="290" stroke="#44403c" stroke-width="3"/>

  <!-- Secondaire HT (droite du noyau) -->
  <g transform="translate(395, 195)">
    <path d="M0,0 C5,-8 15,-8 20,0 C25,-8 35,-8 40,0" stroke="#7c2d12" stroke-width="2.5" fill="none"/>
    <path d="M0,7 C5,-1 15,-1 20,7 C25,-1 35,-1 40,7" stroke="#7c2d12" stroke-width="2.5" fill="none"/>
    <path d="M0,14 C5,6 15,6 20,14 C25,6 35,6 40,14" stroke="#7c2d12" stroke-width="2.5" fill="none"/>
    <path d="M0,21 C5,13 15,13 20,21 C25,13 35,13 40,21" stroke="#7c2d12" stroke-width="2.5" fill="none"/>
    <text x="20" y="38" text-anchor="middle" font-size="9" fill="#7c2d12" font-weight="bold">Secondaire</text>
    <text x="20" y="50" text-anchor="middle" font-size="9" fill="#7c2d12">~2 100 V AC</text>
  </g>

  <!-- Secondaire filament (petit, en bas du MOT) -->
  <g transform="translate(330, 268)">
    <path d="M0,0 C8,-6 22,-6 30,0" stroke="#f97316" stroke-width="2" fill="none"/>
    <text x="15" y="16" text-anchor="middle" font-size="8" fill="#ea580c">3,15 V fil.</text>
  </g>

  <!-- N sur primaire bas -->
  <line x1="250" y1="225" x2="330" y2="225" stroke="#2563eb" stroke-width="2"/>

  <!-- ============ DOUBLEUR DE TENSION (demi-onde) ============ -->
  <!-- Encadré doubleur -->
  <rect x="475" y="120" width="290" height="230" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="620" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Doubleur de tension (Villard)</text>

  <!-- Sortie secondaire HT → vers doubleur -->
  <line x1="435" y1="195" x2="500" y2="195" stroke="#7c2d12" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Diode HV -->
  <g transform="translate(510, 175)">
    <polygon points="0,20 30,10 30,30" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <line x1="30" y1="10" x2="30" y2="30" stroke="#dc2626" stroke-width="3"/>
    <text x="15" y="48" text-anchor="middle" font-size="9" fill="#991b1b" font-weight="bold">Diode HV</text>
    <text x="15" y="60" text-anchor="middle" font-size="8" fill="#991b1b">CL01-12</text>
    <text x="15" y="72" text-anchor="middle" font-size="8" fill="#991b1b">12 kV PIV</text>
  </g>

  <!-- Nœud entre diode et capa -->
  <line x1="540" y1="195" x2="600" y2="195" stroke="#475569" stroke-width="2"/>

  <!-- Capacité HV -->
  <g transform="translate(600, 175)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#475569" stroke-width="3"/>
    <line x1="10" y1="0" x2="10" y2="40" stroke="#475569" stroke-width="3"/>
    <text x="5" y="58" text-anchor="middle" font-size="9" fill="#334155" font-weight="bold">C ≈ 1 µF</text>
    <text x="5" y="70" text-anchor="middle" font-size="8" fill="#475569">2 100 V AC</text>
  </g>

  <!-- Fil de sortie : nœud → cathode magnétron -->
  <line x1="600" y1="195" x2="700" y2="195" stroke="#dc2626" stroke-width="3"/>
  <line x1="700" y1="195" x2="700" y2="310" stroke="#dc2626" stroke-width="3"/>

  <!-- Retour masse du condensateur -->
  <line x1="610" y1="195" x2="610" y2="310" stroke="#475569" stroke-width="2"/>

  <!-- Retour secondaire HT (bas) -->
  <line x1="435" y1="225" x2="500" y2="225" stroke="#7c2d12" stroke-width="2"/>
  <line x1="500" y1="225" x2="500" y2="310" stroke="#475569" stroke-width="2"/>

  <!-- Barre de masse commune -->
  <line x1="480" y1="310" x2="720" y2="310" stroke="#16a34a" stroke-width="3"/>
  <g fill="#16a34a" font-size="9">
    <text x="600" y="328" text-anchor="middle" font-weight="bold">CHÂSSIS / MASSE</text>
    <!-- Symbole masse -->
    <line x1="600" y1="310" x2="600" y2="318" stroke="#16a34a" stroke-width="2"/>
    <line x1="585" y1="318" x2="615" y2="318" stroke="#16a34a" stroke-width="2"/>
    <line x1="590" y1="323" x2="610" y2="323" stroke="#16a34a" stroke-width="1.5"/>
    <line x1="595" y1="328" x2="605" y2="328" stroke="#16a34a" stroke-width="1"/>
  </g>

  <!-- Annotation tension de sortie -->
  <rect x="660" y="230" width="100" height="55" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="710" y="248" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">−4 000 V DC</text>
  <text x="710" y="262" text-anchor="middle" font-size="9" fill="#dc2626">cathode 2M213-01TAG</text>
  <text x="710" y="276" text-anchor="middle" font-size="9" fill="#dc2626">≈ 300 mA crête</text>

  <!-- ============ MAGNÉTRON 2M213 (sortie) ============ -->
  <rect x="650" y="380" width="130" height="110" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <ellipse cx="715" cy="420" rx="30" ry="15" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <g fill="#7f1d1d"><circle cx="695" cy="420" r="4"/><circle cx="715" cy="420" r="4"/><circle cx="735" cy="420" r="4"/></g>
  <text x="715" y="407" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">2M213-01TAG</text>
  <text x="715" y="460" text-anchor="middle" font-size="10" fill="#c2410c" font-weight="bold">~700 W</text>
  <text x="715" y="475" text-anchor="middle" font-size="9" fill="#c2410c">2,45 GHz</text>

  <!-- HT vers magnétron -->
  <line x1="700" y1="310" x2="700" y2="380" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>

  <!-- Filament vers magnétron -->
  <line x1="360" y1="278" x2="360" y2="430" stroke="#f97316" stroke-width="2"/>
  <line x1="360" y1="430" x2="650" y2="430" stroke="#f97316" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="423" text-anchor="middle" font-size="9" fill="#ea580c" font-weight="bold">Filament 3,15 V AC @ 10 A</text>
  <text x="500" y="438" text-anchor="middle" font-size="8" fill="#ea580c">⚠ au potentiel cathode (−4 kV)</text>

  <!-- ============ SORTIE RF ============ -->
  <line x1="715" y1="490" x2="715" y2="540" stroke="#a855f7" stroke-width="3" filter="url(#glow)"/>
  <polygon points="705,540 725,540 715,555" fill="#a855f7"/>
  <text x="715" y="575" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">RF → iris → chambre</text>
  <text x="715" y="590" text-anchor="middle" font-size="10" fill="#7c3aed">2,45 GHz · ~200–400 W effectifs</text>

  <!-- ============ ANNOTATIONS SÉCURITÉ ============ -->
  <rect x="30" y="390" width="300" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="413" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">⚠️ SÉCURITÉ — HV</text>
  <g font-size="10" fill="#991b1b">
    <text x="45" y="433">• Tension mortelle : 4 000 V DC</text>
    <text x="45" y="450">• Énergie stockée : ½CV² ≈ 8,8 J (capa 1 µF)</text>
    <text x="45" y="467">• Décharge en ~14 ms sous charge</text>
    <text x="45" y="484">• TOUJOURS décharger le condo avant</text>
    <text x="45" y="501">  intervention (résistance de purge)</text>
  </g>

  <!-- Annotation SSR -->
  <rect x="30" y="280" width="250" height="80" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="155" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Commande SSR zero-crossing</text>
  <g font-size="9" fill="#166534">
    <text x="45" y="316">• Résolution : ~10 % par fenêtre 167 ms</text>
    <text x="45" y="330">• Latence : &lt; 16 ms (1 cycle 60 Hz)</text>
    <text x="45" y="344">• Pas d'harmoniques → pas de mode-hopping</text>
  </g>
</svg>
