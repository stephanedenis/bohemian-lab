<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 750" font-family="'Segoe UI', Arial, sans-serif" font-size="11">
  <defs>
    <linearGradient id="barilG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="15%" stop-color="#a8a29e"/>
      <stop offset="85%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#78716c"/>
    </linearGradient>
    <linearGradient id="plasmaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Titre -->
  <text x="350" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Schéma d'ensemble — Vue en coupe (élévation)</text>

  <!-- Baril 205L -->
  <rect x="80" y="40" width="540" height="600" rx="14" fill="#fafaf9" stroke="#57534e" stroke-width="4"/>
  <text x="350" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#57534e">BARIL 205L (posé au sol — référentiel fixe)</text>
  <text x="350" y="77" text-anchor="middle" font-size="10" fill="#78716c">⌀ 580 mm × 880 mm</text>

  <!-- Couvercle baril -->
  <rect x="80" y="87" width="540" height="10" fill="url(#barilG)" stroke="#57534e" stroke-width="1"/>
  <text x="350" y="84" text-anchor="middle" font-size="9" fill="#78716c">— couvercle du baril —</text>

  <!-- Fil de torsion -->
  <line x1="350" y1="97" x2="350" y2="180" stroke="#a16207" stroke-width="2.5"/>
  <text x="380" y="115" font-size="10" fill="#854d0e" font-weight="bold">Fil de torsion</text>
  <text x="380" y="128" font-size="9" fill="#854d0e">(seul lien mécanique)</text>

  <!-- Fléau -->
  <rect x="120" y="180" width="460" height="10" rx="3" fill="#78716c" stroke="#44403c" stroke-width="2"/>

  <!-- Point de pivot -->
  <circle cx="350" cy="185" r="6" fill="#1e293b" stroke="white" stroke-width="2"/>

  <!-- Cotes 200 mm -->
  <g font-size="9" fill="#1e293b">
    <line x1="220" y1="198" x2="220" y2="210" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="350" y1="198" x2="350" y2="210" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="480" y1="198" x2="480" y2="210" stroke="#1e293b" stroke-width="0.8"/>
    <text x="285" y="208" text-anchor="middle" font-weight="bold">← 200 mm →</text>
    <text x="415" y="208" text-anchor="middle" font-weight="bold">← 200 mm →</text>
    <text x="350" y="200" text-anchor="middle" font-size="8">FLÉAU</text>
  </g>

  <!-- Chambre inox (gauche) -->
  <rect x="140" y="220" width="160" height="300" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Couvercle acrylique chambre -->
  <rect x="140" y="220" width="160" height="14" rx="3" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
  <text x="220" y="231" text-anchor="middle" font-size="8" fill="#0c4a6e">Acrylique 3/4"</text>

  <!-- Plasma -->
  <rect x="160" y="255" width="120" height="100" rx="8" fill="url(#plasmaG)" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="220" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed" opacity="0.8">PLASMA</text>
  <text x="220" y="312" text-anchor="middle" font-size="10" fill="#7c3aed" opacity="0.6">H₂O</text>
  <text x="220" y="328" text-anchor="middle" font-size="9" fill="#7c3aed" opacity="0.5">2–5 mbar</text>

  <!-- 8× IN-13 -->
  <g fill="#22c55e" stroke="#15803d" stroke-width="1">
    <rect x="148" y="260" width="6" height="80" rx="2"/>
    <rect x="286" y="260" width="6" height="80" rx="2"/>
  </g>
  <text x="220" y="368" text-anchor="middle" font-size="9" fill="#15803d" font-weight="bold">8× IN-13 (octogone)</text>

  <!-- Magnétron -->
  <rect x="155" y="385" width="50" height="20" rx="3" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="180" y="399" text-anchor="middle" font-size="8" fill="white" font-weight="bold">MAG</text>
  <text x="220" y="420" text-anchor="middle" font-size="9" fill="#991b1b">Magnétron</text>

  <!-- Vanne DN10 -->
  <rect x="240" y="385" width="45" height="20" rx="3" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
  <text x="262" y="399" text-anchor="middle" font-size="8" fill="white" font-weight="bold">DN10</text>
  <text x="220" y="440" text-anchor="middle" font-size="9" fill="#334155">Vanne DN10</text>

  <!-- Batterie + onduleur + ESP32 (sous la chambre, à l'extérieur) -->
  <rect x="142" y="462" width="156" height="55" rx="5" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="220" y="478" text-anchor="middle" font-size="9" fill="#854d0e">🔋 Batterie Makita 18V</text>
  <text x="220" y="492" text-anchor="middle" font-size="9" fill="#854d0e">⚡ Onduleur 120V</text>
  <text x="220" y="506" text-anchor="middle" font-size="9" fill="#854d0e">🖥 ESP32</text>

  <!-- Label chambre -->
  <text x="85" y="350" font-size="10" fill="#1e40af" font-weight="bold" writing-mode="tb">CHAMBRE INOX 3 gal</text>
  <text x="98" y="316" font-size="9" fill="#1e40af" writing-mode="tb">⌀250×250 mm</text>

  <!-- Contrepoids (droite) -->
  <rect x="420" y="220" width="120" height="120" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">CONTRE-</text>
  <text x="480" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">POIDS</text>
  <text x="480" y="310" text-anchor="middle" font-size="11" fill="#991b1b">~ 10 kg</text>

  <!-- Miroir -->
  <rect x="340" y="225" width="16" height="8" rx="1" fill="#fbbf24" stroke="#a16207" stroke-width="1.5" transform="rotate(45, 348, 229)"/>
  <text x="350" y="253" text-anchor="middle" font-size="9" fill="#a16207" font-weight="bold">[M] Miroir</text>
  <text x="350" y="265" text-anchor="middle" font-size="8" fill="#a16207">(sur le fléau, près de l'axe)</text>

  <!-- Laser → Miroir → PSD -->
  <rect x="120" y="565" width="460" height="50" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="350" y="582" text-anchor="middle" font-size="10" fill="#9a3412" font-weight="bold">Laser ──→ [Miroir] ──→ PSD</text>
  <text x="350" y="598" text-anchor="middle" font-size="9" fill="#9a3412">(fixés à la paroi interne du baril)</text>

  <!-- Caméra -->
  <text x="350" y="633" text-anchor="middle" font-size="10" fill="#6366f1">📷 Caméra Wi-Fi (hublot)</text>

  <!-- EXTÉRIEUR du baril -->
  <rect x="120" y="660" width="460" height="75" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="350" y="680" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Extérieur du baril</text>
  <text x="250" y="700" text-anchor="middle" font-size="10" fill="#166534">🔧 Pompe à vide</text>
  <text x="250" y="715" text-anchor="middle" font-size="9" fill="#166534">(déconnectée pendant la mesure)</text>
  <text x="470" y="700" text-anchor="middle" font-size="10" fill="#166534">📱 Dashboard Wi-Fi</text>
  <text x="470" y="715" text-anchor="middle" font-size="9" fill="#166534">📷 Caméras mobiles</text>
</svg>
