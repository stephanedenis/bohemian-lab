<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 1060" font-family="'Segoe UI', Arial, sans-serif" font-size="11">
  <rect width="740" height="1060" fill="#ffffff"/>
  <defs>
    <linearGradient id="barilG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="15%" stop-color="#a8a29e"/>
      <stop offset="85%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#78716c"/>
    </linearGradient>
    <linearGradient id="plasmaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="grille" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 0h6M0 0v6" stroke="#78716c" stroke-width="0.6" fill="none"/>
    </pattern>
  </defs>

  <!-- Titre -->
  <text x="370" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Schéma d'ensemble — Vue en coupe (élévation)</text>

  <!-- ==================== BARIL 205L — silhouette classique ==================== -->
  <!--
       Baril 205L : ⌀ 580 mm × 880 mm.
       Silhouette avec sertissage du fond et du couvercle,
       et 2 anneaux de renforcement embossés (rolling hoops).
       Corps : y=60 à y=870.
       Sertissage couvercle : rebord bombé au-dessus de y=60.
       Sertissage fond       : rebord bombé en dessous de y=870.
       Anneaux embossés à ≈ 1/3 et ≈ 2/3 de la hauteur.
  -->

  <!-- Fond intérieur du baril (surface blanche) -->
  <rect x="82" y="60" width="576" height="810" fill="#fafaf9" stroke="none"/>

  <!-- Parois verticales du corps -->
  <line x1="80" y1="60" x2="80" y2="870" stroke="#57534e" stroke-width="3.5"/>
  <line x1="660" y1="60" x2="660" y2="870" stroke="#57534e" stroke-width="3.5"/>

  <!-- Fond du baril (sertissage inférieur — rebord bombé) -->
  <line x1="80" y1="870" x2="660" y2="870" stroke="#57534e" stroke-width="2"/>
  <path d="M74,870 Q74,882 82,882 L658,882 Q666,882 666,870" fill="none" stroke="#57534e" stroke-width="2.5"/>
  <rect x="80" y="865" width="580" height="5" fill="#d6d3d1" stroke="none"/>

  <!-- Sertissage du couvercle (rebord bombé haut) -->
  <path d="M74,60 Q74,48 82,48 L658,48 Q666,48 666,60" fill="none" stroke="#57534e" stroke-width="2.5"/>

  <!-- Anneau de renforcement embossé n°1 (~1/3 → y≈330) -->
  <path d="M78,324 Q70,331 78,338" fill="none" stroke="#57534e" stroke-width="2.5"/>
  <path d="M662,324 Q670,331 662,338" fill="none" stroke="#57534e" stroke-width="2.5"/>
  <line x1="82" y1="326" x2="82" y2="336" stroke="#a8a29e" stroke-width="0.8" opacity="0.5"/>
  <line x1="658" y1="326" x2="658" y2="336" stroke="#a8a29e" stroke-width="0.8" opacity="0.5"/>

  <!-- Anneau de renforcement embossé n°2 (~2/3 → y≈600) -->
  <path d="M78,594 Q70,601 78,608" fill="none" stroke="#57534e" stroke-width="2.5"/>
  <path d="M662,594 Q670,601 662,608" fill="none" stroke="#57534e" stroke-width="2.5"/>
  <line x1="82" y1="596" x2="82" y2="606" stroke="#a8a29e" stroke-width="0.8" opacity="0.5"/>
  <line x1="658" y1="596" x2="658" y2="606" stroke="#a8a29e" stroke-width="0.8" opacity="0.5"/>

  <!-- Couvercle du baril (amovible — ne supporte plus le fil) -->
  <rect x="80" y="60" width="580" height="12" fill="url(#barilG)" stroke="#57534e" stroke-width="1.5"/>
  <text x="370" y="55" text-anchor="middle" font-size="9" fill="#78716c">— couvercle du baril (amovible) —</text>

  <!-- Annotations du baril -->
  <text x="370" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#57534e">BARIL 205L (posé au sol — référentiel fixe)</text>
  <text x="370" y="102" text-anchor="middle" font-size="10" fill="#78716c">⌀ 580 mm × 880 mm</text>

  <!-- Annotations anneaux -->
  <text x="56" y="329" text-anchor="end" font-size="7" fill="#78716c">anneau</text>
  <text x="56" y="339" text-anchor="end" font-size="7" fill="#78716c">embossé</text>
  <text x="56" y="599" text-anchor="end" font-size="7" fill="#78716c">anneau</text>
  <text x="56" y="609" text-anchor="end" font-size="7" fill="#78716c">embossé</text>

  <!-- ==================== BARRE TRANSVERSALE ==================== -->
  <!--
       Barre métallique fixée aux parois intérieures du baril,
       juste sous le couvercle. Supporte le fil de torsion + caméra.
       Touche les parois : x=80 (paroi G) à x=660 (paroi D).
  -->

  <!-- Label barre transversale (dans l'espace entre couvercle y=72 et barre y=125) -->
  <text x="370" y="118" text-anchor="middle" font-size="9" fill="#44403c" font-weight="bold">BARRE TRANSVERSALE (fixée aux parois)</text>

  <!-- Barre elle-même (en appui direct paroi à paroi) -->
  <rect x="80" y="126" width="580" height="12" rx="4" fill="#78716c" stroke="#44403c" stroke-width="2"/>

  <!-- ==================== CAMÉRA SUR LA BARRE TRANSVERSALE ==================== -->
  <rect x="460" y="138" width="38" height="16" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="479" y="149" text-anchor="middle" font-size="7" fill="#1d4ed8" font-weight="bold">📷 Cam</text>
  <text x="479" y="166" text-anchor="middle" font-size="7" fill="#3b82f6">Caméra Wi-Fi</text>
  <text x="479" y="175" text-anchor="middle" font-size="7" fill="#3b82f6">(sur barre, vue ↓)</text>

  <!-- ==================== FIL DE TORSION ==================== -->
  <!--
       Le fil est ancré à la barre transversale (y=138),
       pas au couvercle.
       Fil de torsion : y=138 à y=480 ≈ ~500 mm.
  -->
  <line x1="370" y1="138" x2="370" y2="480" stroke="#a16207" stroke-width="2.5"/>

  <!-- Annotation fil de torsion -->
  <text x="420" y="260" font-size="11" fill="#854d0e" font-weight="bold">Fil de torsion</text>
  <text x="420" y="276" font-size="9" fill="#854d0e">(κ = πGr⁴ / 2ℓ</text>
  <text x="420" y="289" font-size="9" fill="#854d0e"> → κ ∝ 1/ℓ</text>
  <text x="420" y="302" font-size="9" fill="#854d0e"> → sensibilité max)</text>

  <!-- Cote longueur du fil -->
  <line x1="355" y1="138" x2="355" y2="480" stroke="#a16207" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="348" y1="138" x2="362" y2="138" stroke="#a16207" stroke-width="0.8"/>
  <line x1="348" y1="480" x2="362" y2="480" stroke="#a16207" stroke-width="0.8"/>
  <text x="344" y="310" text-anchor="end" font-size="9" fill="#a16207" font-weight="bold" writing-mode="tb">~ 500 mm</text>

  <!-- Attache fil/tige (cercle) -->
  <circle cx="370" cy="480" r="5" fill="#a16207" stroke="#854d0e" stroke-width="1.5"/>

  <!-- ==================== MIROIR (en haut de la tige, près de l'attache) ==================== -->
  <rect x="345" y="484" width="16" height="8" rx="1" fill="#fbbf24" stroke="#a16207" stroke-width="1.5" transform="rotate(45, 353, 488)"/>
  <text x="330" y="502" text-anchor="end" font-size="9" fill="#a16207" font-weight="bold">[M] Miroir</text>
  <text x="330" y="513" text-anchor="end" font-size="8" fill="#a16207">(haut de tige)</text>

  <!-- ==================== TIGE RIGIDE VERTICALE (doublée ≈ 300 mm) ==================== -->
  <!--
       Tige de y=485 à y=790 = 305 px ≈ 300 mm.
  -->
  <rect x="366" y="485" width="8" height="305" rx="2" fill="#57534e" stroke="#44403c" stroke-width="1.5"/>
  <text x="388" y="550" font-size="10" fill="#44403c" font-weight="bold">Tige rigide</text>
  <text x="388" y="564" font-size="8" fill="#44403c">(~ 300 mm,</text>
  <text x="388" y="575" font-size="8" fill="#44403c"> miroir dégagé</text>
  <text x="388" y="586" font-size="8" fill="#44403c"> au sommet)</text>

  <!-- ==================== SYSTÈME OPTIQUE (paroi du baril) ==================== -->
  <rect x="85" y="480" width="28" height="16" rx="3" fill="#f97316" stroke="#c2410c" stroke-width="1"/>
  <text x="99" y="491" text-anchor="middle" font-size="6" fill="white" font-weight="bold">Laser</text>
  <line x1="113" y1="488" x2="345" y2="488" stroke="#f97316" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="630" y="480" width="28" height="16" rx="3" fill="#f97316" stroke="#c2410c" stroke-width="1"/>
  <text x="644" y="491" text-anchor="middle" font-size="6" fill="white" font-weight="bold">PSD</text>
  <line x1="630" y1="488" x2="370" y2="488" stroke="#f97316" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="550" y="475" font-size="8" fill="#9a3412">Laser → [M] → PSD (paroi baril)</text>

  <!-- ==================== ESPACE VIDE ANNOTÉ ==================== -->
  <text x="230" y="370" text-anchor="middle" font-size="10" fill="#a16207" font-style="italic" opacity="0.5">‹ espace dédié au fil de torsion ›</text>

  <!-- ==================== PLATEAU PORTEUR ==================== -->
  <rect x="120" y="790" width="500" height="14" rx="3" fill="#d6d3d1" stroke="#57534e" stroke-width="2"/>

  <!-- Cotes 200 mm -->
  <g font-size="9" fill="#1e293b">
    <line x1="230" y1="810" x2="230" y2="820" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="370" y1="810" x2="370" y2="820" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="510" y1="810" x2="510" y2="820" stroke="#1e293b" stroke-width="0.8"/>
    <text x="300" y="819" text-anchor="middle" font-weight="bold">← 200 mm →</text>
    <text x="440" y="819" text-anchor="middle" font-weight="bold">← 200 mm →</text>
  </g>
  <text x="370" y="838" text-anchor="middle" font-size="11" fill="#57534e" font-weight="bold">PLATEAU PORTEUR (module autonome)</text>

  <!-- ==================== CÔTÉ A : CHAMBRE (ouverture en haut) ==================== -->
  <!--
       Empilage du bas vers le haut (y décroissant) :
       plateau (y=790) → fond inox (y=780) → parois+nixie+plasma (y=620–780, 160px) →
       joint (y=616–620) → acrylique (y=603–616) → DN10 →
       vanne+connecteur (y=582–603) → grillage Faraday (y=595–603) →
       magnétron+capteurs (y=576–595)

       Chambre ⌀250×250 mm → proportions carrées : w=160, h=160 px
  -->

  <!-- Fond du chaudron (repose sur le plateau) -->
  <rect x="150" y="780" width="160" height="10" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="2"/>

  <!-- Parois inox du chaudron (160×160 px = section carrée) -->
  <rect x="150" y="620" width="160" height="160" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>

  <!-- 8× IN-13 (1 seule rangée centrée, vue en coupe : 1 tube visible par côté) -->
  <g fill="#22c55e" stroke="#15803d" stroke-width="1">
    <rect x="157" y="665" width="5" height="70" rx="1.5"/>
    <rect x="298" y="665" width="5" height="70" rx="1.5"/>
  </g>
  <text x="230" y="770" text-anchor="middle" font-size="8" fill="#15803d" font-weight="bold">8× IN-13 (octogone, 1 rangée centrée)</text>

  <!-- Plasma -->
  <rect x="172" y="655" width="116" height="90" rx="8" fill="url(#plasmaG)" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="230" y="690" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed" opacity="0.8">PLASMA</text>
  <text x="230" y="705" text-anchor="middle" font-size="9" fill="#7c3aed" opacity="0.6">H₂O 2–5 mbar</text>

  <!-- Labels chambre -->
  <text x="132" y="710" font-size="10" fill="#1e40af" font-weight="bold" writing-mode="tb">CHAMBRE INOX</text>
  <text x="319" y="690" font-size="9" fill="#1e40af" writing-mode="tb">⌀250×250</text>

  <!-- Joint silicone -->
  <rect x="150" y="616" width="160" height="4" rx="1" fill="#fdba74" stroke="#ea580c" stroke-width="0.8"/>

  <!-- Couvercle acrylique -->
  <rect x="150" y="603" width="160" height="13" rx="2" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Vanne DN10 (dans l'acrylique) -->
  <rect x="220" y="601" width="20" height="17" rx="2" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <text x="247" y="613" font-size="7" fill="#334155">DN10</text>

  <!-- ===== VANNE + CONNECTEUR au-dessus du DN10 ===== -->
  <rect x="225" y="584" width="10" height="17" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  <rect x="219" y="576" width="22" height="10" rx="2" fill="#78716c" stroke="#334155" stroke-width="1.5"/>
  <text x="205" y="583" text-anchor="end" font-size="7" fill="#334155">Connecteur</text>
  <text x="205" y="592" text-anchor="end" font-size="7" fill="#334155">pompage ↓</text>

  <!-- Grillage Faraday -->
  <rect x="150" y="595" width="160" height="8" rx="1" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
  <rect x="152" y="596" width="156" height="6" rx="1" fill="url(#grille)" opacity="0.5"/>
  <!-- Fenêtre/iris -->
  <rect x="168" y="595" width="28" height="8" rx="1" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="182" y="601" text-anchor="middle" font-size="5" fill="#ea580c">iris</text>

  <!-- Magnétron (AU-DESSUS du grillage — hors cage) -->
  <rect x="155" y="576" width="56" height="19" rx="3" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="183" y="587" text-anchor="middle" font-size="7" fill="white" font-weight="bold">MAGNÉTRON</text>
  <text x="183" y="593" text-anchor="middle" font-size="6" fill="#fecaca">1 kW</text>

  <!-- Coupleur directionnel -->
  <rect x="220" y="578" width="40" height="14" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="240" y="588" text-anchor="middle" font-size="6" fill="#92400e" font-weight="bold">Coupleur</text>

  <!-- Caméra Wi-Fi (vue plasma à travers le grillage) -->
  <rect x="268" y="578" width="38" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="287" y="588" text-anchor="middle" font-size="6" fill="#1d4ed8" font-weight="bold">📷 Cam</text>

  <!-- Annotations empilage côté A (au-dessus de la chambre) -->
  <g font-size="8" fill="#64748b">
    <text x="150" y="522" text-anchor="start" font-style="italic">Empilage chambre (haut → bas) :</text>
    <text x="155" y="534" text-anchor="start">· magnétron + capteurs (hors cage)</text>
    <text x="155" y="545" text-anchor="start">· grillage Faraday (iris)</text>
    <text x="155" y="556" text-anchor="start">· acrylique 3/4" + DN10 · joint</text>
    <text x="155" y="567" text-anchor="start">· ouverture ↓ chambre · fond sur plateau</text>
  </g>

  <!-- ==================== CÔTÉ B : CONTREPOIDS ==================== -->
  <rect x="440" y="680" width="140" height="110" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="510" y="700" text-anchor="middle" font-size="9" fill="#7f1d1d">🔋 Batterie Makita 18V</text>
  <text x="510" y="713" text-anchor="middle" font-size="9" fill="#7f1d1d">⚡ Onduleur 120V</text>
  <text x="510" y="726" text-anchor="middle" font-size="9" fill="#7f1d1d">🖥 ESP32 (blindé)</text>
  <line x1="455" y1="735" x2="565" y2="735" stroke="#dc2626" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="510" y="755" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">CONTREPOIDS</text>
  <text x="510" y="772" text-anchor="middle" font-size="10" fill="#991b1b">~ 10 kg</text>

  <!-- ==================== ACCOLADE MODULE AUTONOME ==================== -->
  <line x1="105" y1="480" x2="105" y2="804" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="105" y1="480" x2="115" y2="480" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="105" y1="804" x2="115" y2="804" stroke="#0284c7" stroke-width="1.5"/>
  <text x="92" y="600" text-anchor="end" font-size="9" fill="#0284c7" font-weight="bold" writing-mode="tb">MODULE AUTONOME</text>
  <text x="80" y="605" text-anchor="end" font-size="8" fill="#0284c7" writing-mode="tb">(¼ inférieur du baril)</text>

  <!-- ==================== EXTÉRIEUR DU BARIL ==================== -->
  <rect x="120" y="900" width="500" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="370" y="918" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Extérieur du baril</text>
  <text x="250" y="935" text-anchor="middle" font-size="10" fill="#166534">🔧 Pompe à vide (déconnectée pdt mesure)</text>
  <text x="490" y="935" text-anchor="middle" font-size="10" fill="#166534">📱 Dashboard + 📷 Caméras</text>

  <!-- ==================== LÉGENDE ==================== -->
  <rect x="120" y="970" width="500" height="90" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="370" y="988" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">Légende</text>
  <rect x="140" y="996" width="16" height="10" rx="2" fill="#78716c" stroke="#44403c" stroke-width="1"/>
  <text x="161" y="1004" font-size="8" fill="#1e293b">Barre transversale (fixée aux parois)</text>
  <line x1="350" y1="1000" x2="370" y2="1000" stroke="#a16207" stroke-width="2.5"/>
  <text x="375" y="1004" font-size="8" fill="#1e293b">Fil de torsion (≈ 500 mm → κ minimal)</text>
  <rect x="140" y="1012" width="10" height="10" rx="1" fill="#57534e" stroke="#44403c" stroke-width="1"/>
  <text x="155" y="1020" font-size="8" fill="#1e293b">Tige rigide (~ 300 mm, miroir dégagé)</text>
  <rect x="350" y="1012" width="10" height="10" rx="1" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
  <text x="365" y="1020" font-size="8" fill="#1e293b">Magnétron (hors cage)</text>
  <rect x="140" y="1028" width="10" height="10" rx="1" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="155" y="1036" font-size="8" fill="#1e293b">Contrepoids (bat. + onduleur + ESP32)</text>
  <rect x="350" y="1028" width="10" height="10" rx="1" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="365" y="1036" font-size="8" fill="#1e293b">📷 Caméras Wi-Fi (barre + chambre)</text>
  <line x1="140" y1="1050" x2="155" y2="1050" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="160" y="1053" font-size="8" fill="#1e293b">Module autonome (¼ inférieur)</text>
  <rect x="350" y="1046" width="10" height="10" rx="1" fill="#d6d3d1" stroke="#57534e" stroke-width="1"/>
  <text x="365" y="1053" font-size="8" fill="#1e293b">Plateau porteur</text>
</svg>
