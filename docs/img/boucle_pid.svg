<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="'Segoe UI', Arial, sans-serif" font-size="11">
  <rect width="620" height="300" fill="#ffffff"/>
  <defs>
    <marker id="pidArr" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4f46e5"/>
    </marker>
    <marker id="fbArr" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Titre -->
  <text x="310" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Homéostasie du plasma — Boucle de rétroaction PID</text>

  <!-- Consigne -->
  <rect x="40" y="85" width="100" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Consigne</text>
  <text x="90" y="120" text-anchor="middle" font-size="10" fill="#1e40af">nₑ = nₑ,c</text>

  <!-- Flèche Consigne → PID -->
  <line x1="140" y1="110" x2="180" y2="110" stroke="#4f46e5" stroke-width="2" marker-end="url(#pidArr)"/>

  <!-- Contrôleur PID -->
  <rect x="190" y="75" width="120" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="250" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">Contrôleur</text>
  <text x="250" y="118" text-anchor="middle" font-size="11" fill="#3730a3">(PID)</text>
  <text x="250" y="135" text-anchor="middle" font-size="9" fill="#6366f1">MCU / ESP32</text>

  <!-- Flèche PID → Actionneurs -->
  <line x1="310" y1="110" x2="350" y2="110" stroke="#4f46e5" stroke-width="2" marker-end="url(#pidArr)"/>

  <!-- Actionneurs -->
  <rect x="360" y="75" width="120" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="420" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Actionneurs</text>
  <text x="420" y="118" text-anchor="middle" font-size="9" fill="#166534">vanne H₂O</text>
  <text x="420" y="132" text-anchor="middle" font-size="9" fill="#166534">PWM magnétron</text>

  <!-- Flèche Actionneurs → Plasma -->
  <line x1="480" y1="110" x2="515" y2="110" stroke="#4f46e5" stroke-width="2" marker-end="url(#pidArr)"/>

  <!-- Plasma -->
  <rect x="525" y="70" width="80" height="80" rx="40" fill="#fae8ff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="565" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#7e22ce">Plasma</text>
  <text x="565" y="122" text-anchor="middle" font-size="9" fill="#7e22ce">P, Tₑ, nₑ</text>

  <!-- Boucle retour -->
  <!-- Plasma → vers le bas -->
  <line x1="565" y1="150" x2="565" y2="220" stroke="#dc2626" stroke-width="2"/>
  <!-- Horizontal vers la gauche -->
  <line x1="565" y1="220" x2="200" y2="220" stroke="#dc2626" stroke-width="2"/>

  <!-- Capteurs (sur le chemin retour) -->
  <rect x="310" y="195" width="130" height="50" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="375" y="215" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Capteurs</text>
  <text x="375" y="233" text-anchor="middle" font-size="8" fill="#92400e">pression · lumière RF · T°</text>

  <!-- Flèche capteurs → PID -->
  <line x1="200" y1="220" x2="200" y2="145" stroke="#dc2626" stroke-width="2" marker-end="url(#fbArr)"/>
  <line x1="560" y1="220" x2="445" y2="220" stroke="#dc2626" stroke-width="2" marker-end="url(#fbArr)"/>
  <line x1="310" y1="220" x2="205" y2="220" stroke="#dc2626" stroke-width="2"/>

  <!-- Labels -->
  <text x="165" y="108" font-size="9" fill="#4f46e5" font-weight="bold">+</text>
  <text x="165" y="130" font-size="9" fill="#dc2626" font-weight="bold">−</text>

  <!-- Note -->
  <rect x="120" y="260" width="380" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="310" y="279" text-anchor="middle" font-size="10" fill="#991b1b">Signal-clé : puissance RF réfléchie (Pᵣ min → résonance atteinte)</text>
</svg>
