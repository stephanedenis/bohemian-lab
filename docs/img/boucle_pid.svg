<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300"
     font-family="'Segoe UI', Arial, sans-serif" font-size="11">
  <title>Homéostasie du plasma — Boucle de rétroaction PID (symboles IEC 60617)</title>
  <rect width="740" height="300" fill="#ffffff"/>

  <defs>
    <marker id="arrFwd" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrFb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>

    <!-- ══ Nœud sommateur IEC (cercle + croix) ══ -->
    <g id="sym-sum">
      <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#334155" stroke-width="2.2"/>
      <!-- Croix IEC -->
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#334155" stroke-width="1.2"/>
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#334155" stroke-width="1.2"/>
    </g>

    <!-- ══ Point de prélèvement IEC ══ -->
    <circle id="dot" r="4" fill="#334155"/>

    <!-- ══ Bloc de fonction de transfert IEC ══ -->
    <!-- (rectangle standard, fonction inscrite) -->
  </defs>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TITRE                                                    -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="370" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">
    Homéostasie du plasma — Boucle de rétroaction PID
  </text>
  <text x="370" y="38" text-anchor="middle" font-size="10" fill="#64748b">
    Notation IEC de boucle fermée à rétroaction unitaire
  </text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ENVELOPPE MCU                                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="55" y="52" width="270" height="106" rx="8"
        fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="190" y="66" text-anchor="middle" font-size="9" font-weight="bold" fill="#64748b">
    MCU — ESP32
  </text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- CHAÎNE DIRECTE (y = 100)                                 -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- ① Consigne r(t) -->
  <line x1="15" y1="100" x2="66" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arrFwd)"/>
  <text x="40" y="92" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="bold">r(t)</text>
  <text x="40" y="118" text-anchor="middle" font-size="8" fill="#64748b">nₑ = nₑ,c</text>

  <!-- ② Nœud de sommation IEC -->
  <use href="#sym-sum" x="80" y="100"/>
  <!-- Signes + / − normalisés -->
  <text x="65" y="93" font-size="11" font-weight="bold" fill="#16a34a">+</text>
  <text x="80" y="123" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">−</text>

  <!-- Signal d'erreur e(t) -->
  <line x1="94" y1="100" x2="148" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arrFwd)"/>
  <text x="121" y="92" text-anchor="middle" font-size="10" fill="#92400e" font-style="italic">e(t)</text>

  <!-- ③ Contrôleur PID — bloc IEC fonction de transfert -->
  <rect x="150" y="72" width="140" height="56" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <!-- Fonction de transfert standard -->
  <text x="220" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">C(s)</text>
  <text x="220" y="109" text-anchor="middle" font-size="9" fill="#6366f1">
    Kₚ(1 + 1/Tᵢs + Td·s)
  </text>
  <!-- Label bloc -->
  <text x="220" y="67" text-anchor="middle" font-size="9" fill="#4f46e5" font-weight="bold">Contrôleur PID</text>

  <!-- Signal u(t) : PID → Actionneurs -->
  <line x1="290" y1="100" x2="348" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arrFwd)"/>
  <text x="319" y="92" text-anchor="middle" font-size="10" fill="#92400e" font-style="italic">u(t)</text>

  <!-- ④ Actionneurs — bloc IEC -->
  <rect x="350" y="72" width="130" height="56" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="415" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Actionneurs</text>
  <text x="415" y="105" text-anchor="middle" font-size="9" fill="#166534">Électrovanne H₂O</text>
  <text x="415" y="117" text-anchor="middle" font-size="9" fill="#166534">PWM magnétron</text>

  <!-- Actionneurs → Processus -->
  <line x1="480" y1="100" x2="538" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arrFwd)"/>

  <!-- ⑤ Processus : Plasma G(s) — bloc IEC -->
  <rect x="540" y="70" width="130" height="60" rx="3" fill="#fae8ff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="605" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#7e22ce">G(s)</text>
  <text x="605" y="106" text-anchor="middle" font-size="9" fill="#7e22ce">Plasma H₂O</text>
  <text x="605" y="119" text-anchor="middle" font-size="8" fill="#94a3b8">P, Tₑ, nₑ</text>

  <!-- Sortie y(t) -->
  <line x1="670" y1="100" x2="720" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arrFwd)"/>
  <text x="710" y="92" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="bold">y(t)</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BOUCLE DE RÉTROACTION                                    -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Point de prélèvement IEC (dot) -->
  <use href="#dot" x="690" y="100"/>

  <!-- Descente verticale -->
  <line x1="690" y1="104" x2="690" y2="220" stroke="#dc2626" stroke-width="2"/>

  <!-- Horizontale vers capteurs -->
  <line x1="690" y1="220" x2="510" y2="220" stroke="#dc2626" stroke-width="2" marker-end="url(#arrFb)"/>

  <!-- ⑥ Capteurs H(s) — bloc IEC -->
  <rect x="360" y="195" width="150" height="50" rx="3" fill="#fefce8" stroke="#ca8a04" stroke-width="2.2"/>
  <text x="435" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">H(s)</text>
  <text x="435" y="231" text-anchor="middle" font-size="8" fill="#92400e">Pirani · Pᵣ RF · T° · Luminosité</text>

  <!-- Capteurs → nœud sommation -->
  <line x1="360" y1="220" x2="80" y2="220" stroke="#dc2626" stroke-width="2"/>
  <line x1="80" y1="220" x2="80" y2="114" stroke="#dc2626" stroke-width="2" marker-end="url(#arrFb)"/>

  <!-- Label signal retour -->
  <text x="220" y="214" text-anchor="middle" font-size="10" fill="#dc2626" font-style="italic">ŷ(t)</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- NOTE CLEF                                                -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="140" y="260" width="460" height="28" rx="4"
        fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="370" y="279" text-anchor="middle" font-size="10" fill="#991b1b">
    Signal-clé de rétroaction : puissance RF réfléchie Pᵣ — Pᵣ min → résonance fₚ = f
  </text>

  <!-- Légende IEC -->
  <g font-size="8" fill="#94a3b8">
    <text x="15" y="290">⊕ Nœud sommateur IEC · □ Bloc de fonction de transfert IEC · ● Point de prélèvement</text>
  </g>
</svg>
