<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720"
     font-family="'Segoe UI', Arial, sans-serif" font-size="11">
  <title>Architecture bi-magnétron 2M213-01TAG — Phase 2 (symboles IEC 60617)</title>
  <rect width="920" height="720" fill="#ffffff"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrV" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="plasma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Nœud de jonction -->
    <circle id="dot" r="3.5" fill="#334155"/>

    <!-- ═══ Source AC IEC ═══ -->
    <g id="sym-ac">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#334155" stroke-width="2"/>
      <path d="M-10,0 Q-5,-12 0,0 Q5,12 10,0" stroke="#334155" stroke-width="1.8" fill="none"/>
    </g>

    <!-- ═══ SSR IEC (optocoupleur + triac) ═══ -->
    <g id="sym-ssr">
      <rect x="0" y="0" width="56" height="48" fill="none" stroke="#334155" stroke-width="2"/>
      <!-- LED -->
      <polygon points="8,14 8,34 20,24" fill="none" stroke="#16a34a" stroke-width="1.5"/>
      <!-- Flèches photon -->
      <line x1="18" y1="17" x2="24" y2="13" stroke="#16a34a" stroke-width="0.8"/>
      <line x1="21" y1="13" x2="24" y2="13" stroke="#16a34a" stroke-width="0.8"/>
      <line x1="24" y1="13" x2="24" y2="16" stroke="#16a34a" stroke-width="0.8"/>
      <line x1="18" y1="22" x2="24" y2="18" stroke="#16a34a" stroke-width="0.8"/>
      <line x1="21" y1="18" x2="24" y2="18" stroke="#16a34a" stroke-width="0.8"/>
      <line x1="24" y1="18" x2="24" y2="21" stroke="#16a34a" stroke-width="0.8"/>
      <!-- Triac (2 triangles) -->
      <polygon points="34,14 34,34 46,24" fill="none" stroke="#334155" stroke-width="1.3"/>
      <polygon points="46,14 46,34 34,24" fill="none" stroke="#334155" stroke-width="1.3"/>
      <!-- Barrière isolation -->
      <line x1="28" y1="8" x2="28" y2="40" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2,2"/>
    </g>

    <!-- ═══ Transformateur MOT IEC (bobines + noyau) ═══ -->
    <g id="sym-mot">
      <!-- Primaire (4 demi-arcs, gauche) -->
      <path d="M0,0 A7,7 0 0,1 0,14" stroke="#dc2626" stroke-width="2.2" fill="none"/>
      <path d="M0,14 A7,7 0 0,1 0,28" stroke="#dc2626" stroke-width="2.2" fill="none"/>
      <path d="M0,28 A7,7 0 0,1 0,42" stroke="#dc2626" stroke-width="2.2" fill="none"/>
      <path d="M0,42 A7,7 0 0,1 0,56" stroke="#dc2626" stroke-width="2.2" fill="none"/>
      <!-- Point de polarité primaire -->
      <circle cx="-4" cy="5" r="2" fill="#334155"/>
      <!-- Noyau fer (2 traits) -->
      <line x1="12" y1="-6" x2="12" y2="62" stroke="#44403c" stroke-width="2.5"/>
      <line x1="18" y1="-6" x2="18" y2="62" stroke="#44403c" stroke-width="2.5"/>
      <!-- Secondaire HT (6 demi-arcs, droite) -->
      <path d="M30,0 A6,6 0 0,0 30,10" stroke="#7c2d12" stroke-width="2.2" fill="none"/>
      <path d="M30,10 A6,6 0 0,0 30,20" stroke="#7c2d12" stroke-width="2.2" fill="none"/>
      <path d="M30,20 A6,6 0 0,0 30,30" stroke="#7c2d12" stroke-width="2.2" fill="none"/>
      <path d="M30,30 A6,6 0 0,0 30,40" stroke="#7c2d12" stroke-width="2.2" fill="none"/>
      <path d="M30,40 A6,6 0 0,0 30,50" stroke="#7c2d12" stroke-width="2.2" fill="none"/>
      <path d="M30,50 A6,6 0 0,0 30,60" stroke="#7c2d12" stroke-width="2.2" fill="none"/>
      <!-- Point de polarité secondaire -->
      <circle cx="34" cy="5" r="2" fill="#334155"/>
    </g>

    <!-- ═══ Doubleur Villard IEC (diode + condo) ═══ -->
    <g id="sym-doubler">
      <!-- Entrée (noeud haut) -->
      <line x1="0" y1="0" x2="0" y2="6" stroke="#334155" stroke-width="1.8"/>
      <!-- Diode IEC -->
      <polygon points="-9,6 9,6 0,22" fill="none" stroke="#334155" stroke-width="1.8"/>
      <line x1="-9" y1="22" x2="9" y2="22" stroke="#334155" stroke-width="2.2"/>
      <line x1="0" y1="22" x2="0" y2="30" stroke="#334155" stroke-width="1.8"/>
      <!-- Nœud milieu -->
      <circle cx="0" cy="30" r="2.5" fill="#334155"/>
      <!-- Condensateur horizontal -->
      <line x1="0" y1="30" x2="18" y2="30" stroke="#334155" stroke-width="1.8"/>
      <line x1="18" y1="20" x2="18" y2="40" stroke="#334155" stroke-width="2.2"/>
      <line x1="24" y1="20" x2="24" y2="40" stroke="#334155" stroke-width="2.2"/>
      <line x1="24" y1="30" x2="44" y2="30" stroke="#334155" stroke-width="1.8"/>
      <!-- Nœud sortie : -4 kV -->
      <circle cx="44" cy="30" r="2.5" fill="#dc2626"/>
      <!-- Fil bas → masse -->
      <line x1="0" y1="30" x2="0" y2="50" stroke="#334155" stroke-width="1.8"/>
      <!-- Terre châssis -->
      <line x1="-8" y1="50" x2="8" y2="50" stroke="#334155" stroke-width="1.8"/>
      <line x1="-8" y1="50" x2="-12" y2="58" stroke="#334155" stroke-width="1.3"/>
      <line x1="-1" y1="50" x2="-5" y2="58" stroke="#334155" stroke-width="1.3"/>
      <line x1="6" y1="50" x2="2" y2="58" stroke="#334155" stroke-width="1.3"/>
      <!-- Labels -->
      <text x="-14" y="18" text-anchor="end" font-size="8" fill="#334155">D</text>
      <text x="21" y="14" text-anchor="middle" font-size="8" fill="#334155">C</text>
    </g>

    <!-- ═══ Magnétron IEC (tube à vide) ═══ -->
    <g id="sym-mag">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#334155" stroke-width="2.2"/>
      <!-- Cathode filament -->
      <path d="M-10,-4 L-5,4 L0,-4 L5,4 L10,-4" stroke="#f97316" stroke-width="1.8" fill="none"/>
      <!-- Cavités anode (6 arcs) -->
      <g stroke="#334155" stroke-width="1.3" fill="none">
        <path d="M-20,-16 A5,5 0 0,1 -12,-22"/>
        <path d="M-4,-24 A5,5 0 0,1 4,-24"/>
        <path d="M12,-22 A5,5 0 0,1 20,-16"/>
        <path d="M24,-4 A5,5 0 0,1 24,4"/>
        <path d="M20,16 A5,5 0 0,1 12,22"/>
        <path d="M-12,22 A5,5 0 0,1 -20,16"/>
      </g>
      <!-- Champ B -->
      <path d="M-34,-10 A8,14 0 0,0 -34,10" stroke="#6366f1" stroke-width="1.2" fill="none"/>
      <path d="M34,-10 A8,14 0 0,1 34,10" stroke="#6366f1" stroke-width="1.2" fill="none"/>
    </g>
  </defs>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TITRE                                                    -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="460" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">
    Architecture bi-magnétron 2M213-01TAG — Phase 2
  </text>
  <text x="460" y="44" text-anchor="middle" font-size="11" fill="#64748b">
    2× LG 2M213-01TAG · Un seul actif à la fois · Symboles IEC 60617
  </text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SOURCE AC                                                -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <use href="#sym-ac" x="55" y="340"/>
  <text x="55" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">120 V AC</text>
  <text x="55" y="318" text-anchor="middle" font-size="9" fill="#0369a1">60 Hz</text>

  <!-- Bus L / N -->
  <line x1="55" y1="320" x2="55" y2="170" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="55" y1="360" x2="55" y2="530" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="55" y1="170" x2="140" y2="170" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="55" y1="530" x2="140" y2="530" stroke="#dc2626" stroke-width="2.2"/>
  <!-- N bus -->
  <line x1="75" y1="340" x2="100" y2="340" stroke="#2563eb" stroke-width="2"/>
  <line x1="100" y1="220" x2="100" y2="580" stroke="#2563eb" stroke-width="2"/>
  <line x1="100" y1="220" x2="200" y2="220" stroke="#2563eb" stroke-width="2"/>
  <line x1="100" y1="580" x2="200" y2="580" stroke="#2563eb" stroke-width="2"/>
  <text x="45" y="200" font-size="9" fill="#dc2626" font-weight="bold">L</text>
  <text x="93" y="260" font-size="9" fill="#2563eb" font-weight="bold">N</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- VOIE A (haut) — cadre                                    -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="120" y="80" width="540" height="200" rx="8"
        fill="#fefce8" fill-opacity="0.3" stroke="#ca8a04" stroke-width="2"/>
  <text x="390" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">
    VOIE A — 2M213-01TAG (A)
  </text>
  <text x="590" y="100" font-size="10" fill="#16a34a" font-weight="bold">Phase 1 ✓</text>

  <!-- SSR A -->
  <use href="#sym-ssr" x="140" y="146"/>
  <text x="168" y="140" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">SSR A</text>
  <text x="168" y="206" text-anchor="middle" font-size="8" fill="#16a34a">25 A · ZC</text>
  <line x1="196" y1="170" x2="230" y2="170" stroke="#dc2626" stroke-width="2"/>

  <!-- MOT A -->
  <use href="#sym-mot" x="240" y="145"/>
  <text x="255" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#c2410c">MOT A</text>
  <!-- Retour N primaire -->
  <line x1="200" y1="220" x2="240" y2="220" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="240" y1="201" x2="240" y2="220" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Sortie HT secondaire -->
  <line x1="270" y1="145" x2="340" y2="145" stroke="#7c2d12" stroke-width="1.8"/>

  <!-- Doubleur A -->
  <use href="#sym-doubler" x="350" y="135"/>
  <text x="350" y="128" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">Doubleur A</text>
  <text x="410" y="160" font-size="8" fill="#dc2626">−4 kV</text>
  <!-- Sortie → magnétron A -->
  <line x1="394" y1="165" x2="449" y2="165" stroke="#dc2626" stroke-width="2"/>

  <!-- Magnétron A -->
  <use href="#sym-mag" x="480" y="175"/>
  <text x="480" y="148" text-anchor="middle" font-size="10" font-weight="bold" fill="#b91c1c">2M213 (A)</text>
  <text x="480" y="216" text-anchor="middle" font-size="9" fill="#c2410c">~700 W</text>
  <text x="480" y="228" text-anchor="middle" font-size="8" fill="#c2410c">2,45 GHz</text>

  <!-- Sortie RF A -->
  <line x1="508" y1="175" x2="570" y2="175" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrV)"/>
  <text x="540" y="168" text-anchor="middle" font-size="9" fill="#7c3aed" font-weight="bold">RF A</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- VOIE B (bas) — cadre                                     -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="120" y="430" width="540" height="200" rx="8"
        fill="#eff6ff" fill-opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
  <text x="390" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">
    VOIE B — 2M213-01TAG (B)
  </text>
  <text x="590" y="450" font-size="10" fill="#f59e0b" font-weight="bold">Phase 2</text>

  <!-- SSR B -->
  <use href="#sym-ssr" x="140" y="496"/>
  <text x="168" y="490" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">SSR B</text>
  <text x="168" y="556" text-anchor="middle" font-size="8" fill="#16a34a">25 A · ZC</text>
  <line x1="196" y1="520" x2="230" y2="520" stroke="#dc2626" stroke-width="2"/>

  <!-- MOT B -->
  <use href="#sym-mot" x="240" y="496"/>
  <text x="255" y="488" text-anchor="middle" font-size="10" font-weight="bold" fill="#c2410c">MOT B</text>
  <line x1="200" y1="580" x2="240" y2="580" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="240" y1="552" x2="240" y2="580" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="270" y1="496" x2="340" y2="496" stroke="#7c2d12" stroke-width="1.8"/>

  <!-- Doubleur B -->
  <use href="#sym-doubler" x="350" y="486"/>
  <text x="350" y="478" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">Doubleur B</text>
  <text x="410" y="510" font-size="8" fill="#dc2626">−4 kV</text>
  <line x1="394" y1="516" x2="449" y2="516" stroke="#dc2626" stroke-width="2"/>

  <!-- Magnétron B -->
  <use href="#sym-mag" x="480" y="525"/>
  <text x="480" y="498" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">2M213 (B)</text>
  <text x="480" y="566" text-anchor="middle" font-size="9" fill="#1e40af">~700 W</text>
  <text x="480" y="578" text-anchor="middle" font-size="8" fill="#1e40af">2,45 GHz</text>

  <!-- Sortie RF B -->
  <line x1="508" y1="525" x2="570" y2="525" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrV)"/>
  <text x="540" y="518" text-anchor="middle" font-size="9" fill="#7c3aed" font-weight="bold">RF B</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- IRIS + VOLETS + CHAMBRE                                  -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Iris A (symbole guide d'onde IEC : rectangle hachuré) -->
  <g transform="translate(690,150)">
    <rect x="0" y="0" width="40" height="50" fill="none" stroke="#475569" stroke-width="2"/>
    <!-- Hachures = volet métallique -->
    <line x1="5" y1="5" x2="35" y2="15" stroke="#475569" stroke-width="1"/>
    <line x1="5" y1="15" x2="35" y2="25" stroke="#475569" stroke-width="1"/>
    <line x1="5" y1="25" x2="35" y2="35" stroke="#475569" stroke-width="1"/>
    <line x1="5" y1="35" x2="35" y2="45" stroke="#475569" stroke-width="1"/>
    <text x="20" y="-6" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">IRIS A</text>
    <text x="20" y="64" text-anchor="middle" font-size="8" fill="#475569">volet servo</text>
  </g>
  <line x1="570" y1="175" x2="690" y2="175" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrV)"/>

  <!-- Iris B -->
  <g transform="translate(690,500)">
    <rect x="0" y="0" width="40" height="50" fill="none" stroke="#475569" stroke-width="2"/>
    <line x1="5" y1="5" x2="35" y2="15" stroke="#475569" stroke-width="1"/>
    <line x1="5" y1="15" x2="35" y2="25" stroke="#475569" stroke-width="1"/>
    <line x1="5" y1="25" x2="35" y2="35" stroke="#475569" stroke-width="1"/>
    <line x1="5" y1="35" x2="35" y2="45" stroke="#475569" stroke-width="1"/>
    <text x="20" y="-6" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">IRIS B</text>
    <text x="20" y="64" text-anchor="middle" font-size="8" fill="#475569">volet servo</text>
  </g>
  <line x1="570" y1="525" x2="690" y2="525" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrV)"/>

  <!-- Guide d'onde A → chambre -->
  <line x1="730" y1="200" x2="730" y2="300" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrV)"/>
  <!-- Guide d'onde B → chambre -->
  <line x1="730" y1="500" x2="730" y2="410" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrV)"/>

  <!-- Chambre plasma -->
  <rect x="695" y="300" width="70" height="110" rx="8" fill="url(#plasma)" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="730" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">Chambre</text>
  <text x="730" y="355" text-anchor="middle" font-size="9" fill="#7c3aed">H₂O</text>
  <text x="730" y="370" text-anchor="middle" font-size="9" fill="#7c3aed">2–5 mbar</text>
  <text x="730" y="385" text-anchor="middle" font-size="8" fill="#6d28d9">⌀250×250</text>
  <text x="730" y="400" text-anchor="middle" font-size="8" fill="#6d28d9">8× IN-13</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ESP32 CONTRÔLE                                           -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="110" y="310" width="90" height="80" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <!-- Puce IC IEC (rectangle avec encoche) -->
  <path d="M125,350 A8,8 0 0,1 125,334" stroke="#4f46e5" stroke-width="1.5" fill="none"/>
  <text x="155" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#4338ca">ESP32</text>
  <text x="155" y="355" text-anchor="middle" font-size="9" fill="#6366f1">Contrôleur</text>
  <text x="155" y="368" text-anchor="middle" font-size="9" fill="#6366f1">PID + interlock</text>

  <!-- GPIO → SSR A -->
  <line x1="155" y1="310" x2="155" y2="170" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="155" y1="170" x2="140" y2="170" stroke="#6366f1" stroke-width="1.5"/>
  <text x="163" y="240" font-size="8" fill="#4338ca" writing-mode="tb">GPIO_A</text>

  <!-- GPIO → SSR B -->
  <line x1="155" y1="390" x2="155" y2="520" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="155" y1="520" x2="140" y2="520" stroke="#6366f1" stroke-width="1.5"/>
  <text x="163" y="440" font-size="8" fill="#4338ca" writing-mode="tb">GPIO_B</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- INTERLOCK — IEC symboles de sécurité                     -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="20" y="640" width="880" height="70" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="460" y="662" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">
    ⚠ INTERLOCK MATÉRIEL (ET inversée) — Jamais A et B simultanément
  </text>
  <g font-size="10" fill="#991b1b">
    <text x="40" y="684">1. SSR_A ON ⇒ SSR_B vérifié OFF</text>
    <text x="320" y="684">2. Transition : OFF → 500 ms → ON (iris commuté)</text>
    <text x="650" y="684">3. Watchdog : coupe les deux SSR si anomalie</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LÉGENDE PHASES                                           -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="790" y="80" width="115" height="130" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="848" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Approche</text>
  <text x="848" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">phasée</text>
  <line x1="800" y1="122" x2="896" y2="122" stroke="#16a34a" stroke-width="1"/>
  <text x="848" y="140" text-anchor="middle" font-size="10" fill="#166534" font-weight="bold">Phase 1</text>
  <text x="848" y="155" text-anchor="middle" font-size="9" fill="#166534">Voie A seule</text>
  <text x="848" y="168" text-anchor="middle" font-size="9" fill="#166534">Détecter force</text>
  <line x1="800" y1="176" x2="896" y2="176" stroke="#16a34a" stroke-width="0.5"/>
  <text x="848" y="192" text-anchor="middle" font-size="10" fill="#f59e0b" font-weight="bold">Phase 2</text>
  <text x="848" y="207" text-anchor="middle" font-size="9" fill="#92400e">+ Voie B</text>
  <text x="848" y="220" text-anchor="middle" font-size="9" fill="#92400e">Corréler direction</text>
</svg>
