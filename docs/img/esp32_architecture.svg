<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 460"
     font-family="'Segoe UI', Arial, sans-serif" font-size="11">
  <title>Architecture de la boucle — ESP32 embarqué (symboles IEC 60617)</title>
  <rect width="740" height="460" fill="#ffffff"/>

  <defs>
    <marker id="arrIn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4f46e5"/>
    </marker>
    <marker id="arrOut" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#15803d"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>

    <!-- ══ Capteur IEC (cercle + flèche sortante) ══ -->
    <g id="sym-sensor">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#222" stroke-width="1.8"/>
      <line x1="6" y1="0" x2="18" y2="0" stroke="#222" stroke-width="1.5"/>
      <polygon points="14,-3 20,0 14,3" fill="#222"/>
    </g>

    <!-- ══ Capteur pression IEC (cercle + P) ══ -->
    <g id="sym-pressure">
      <circle cx="0" cy="0" r="16" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
      <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">P</text>
    </g>

    <!-- ══ Capteur photo IEC (cercle + flèche lumière) ══ -->
    <g id="sym-photo">
      <circle cx="0" cy="0" r="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
      <line x1="-6" y1="-6" x2="6" y2="6" stroke="#1d4ed8" stroke-width="1.5"/>
      <!-- Flèches lumière incidente -->
      <line x1="-12" y1="-8" x2="-5" y2="-1" stroke="#1d4ed8" stroke-width="1"/>
      <polygon points="-7,0 -4,-4 -1,-1" fill="#1d4ed8"/>
      <line x1="-8" y1="-12" x2="-1" y2="-5" stroke="#1d4ed8" stroke-width="1"/>
      <polygon points="-3,-4 0,-8 3,-5" fill="#1d4ed8"/>
    </g>

    <!-- ══ Capteur thermique IEC (thermocouple) ══ -->
    <g id="sym-thermo">
      <circle cx="0" cy="0" r="16" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.8"/>
      <!-- Jonction thermocouple -->
      <line x1="-6" y1="8" x2="0" y2="-8" stroke="#0f766e" stroke-width="1.5"/>
      <line x1="6" y1="8" x2="0" y2="-8" stroke="#0f766e" stroke-width="1.5"/>
      <circle cx="0" cy="-8" r="2" fill="#0f766e"/>
    </g>

    <!-- ══ Capteur coupleur directionnel ══ -->
    <g id="sym-coupler">
      <circle cx="0" cy="0" r="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
      <path d="M-8,-4 L0,-4 L8,-4" stroke="#92400e" stroke-width="1.5" fill="none"/>
      <path d="M-8,4 L0,4 L8,4" stroke="#92400e" stroke-width="1.5" fill="none"/>
      <!-- Couplage -->
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#92400e" stroke-width="1" stroke-dasharray="2,1"/>
    </g>

    <!-- ══ Capteur tension (diviseur résistif) ══ -->
    <g id="sym-volt">
      <circle cx="0" cy="0" r="16" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
      <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">V</text>
    </g>

    <!-- ══ Capteur température NTC ══ -->
    <g id="sym-ntc">
      <circle cx="0" cy="0" r="16" fill="#fce7f3" stroke="#ec4899" stroke-width="1.8"/>
      <!-- Résistance IEC + flèche T -->
      <rect x="-8" y="-4" width="16" height="8" fill="none" stroke="#9d174d" stroke-width="1.3"/>
      <line x1="-4" y1="8" x2="4" y2="-8" stroke="#9d174d" stroke-width="1"/>
      <polygon points="3,-10 6,-6 1,-6" fill="#9d174d"/>
    </g>

    <!-- ══ Électrovanne IEC (rectangle + 2 triangles) ══ -->
    <g id="sym-valve">
      <rect x="-22" y="-16" width="44" height="32" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
      <!-- Triangle entrée/sortie -->
      <polygon points="-14,-8 -14,8 -4,0" fill="none" stroke="#15803d" stroke-width="1.3"/>
      <polygon points="4,-8 4,8 14,0" fill="none" stroke="#15803d" stroke-width="1.3"/>
      <!-- Solénoïde (symbole IEC) -->
      <rect x="-6" y="-14" width="12" height="6" fill="none" stroke="#15803d" stroke-width="1"/>
      <line x1="-3" y1="-14" x2="-3" y2="-8" stroke="#15803d" stroke-width="0.8"/>
      <line x1="3" y1="-14" x2="3" y2="-8" stroke="#15803d" stroke-width="0.8"/>
    </g>

    <!-- ══ SSR IEC (optocoupleur + triac) ══ -->
    <g id="sym-ssr">
      <rect x="-22" y="-16" width="44" height="32" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
      <!-- LED triangulaire -->
      <polygon points="-14,-6 -14,6 -6,0" fill="none" stroke="#dc2626" stroke-width="1.3"/>
      <!-- Triac (2 triangles) -->
      <polygon points="2,-6 2,6 12,0" fill="none" stroke="#dc2626" stroke-width="1.2"/>
      <polygon points="12,-6 12,6 2,0" fill="none" stroke="#dc2626" stroke-width="1.2"/>
      <!-- Isolation -->
      <line x1="-2" y1="-14" x2="-2" y2="14" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2,1"/>
    </g>

    <!-- ══ Alarme IEC (symbole alarme sonore) ══ -->
    <g id="sym-alarm">
      <rect x="-22" y="-16" width="44" height="32" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
      <!-- Haut-parleur stylisé -->
      <rect x="-10" y="-6" width="8" height="12" fill="none" stroke="#92400e" stroke-width="1.3"/>
      <polygon points="-2,-10 10,-10 10,10 -2,10" fill="none" stroke="#92400e" stroke-width="1.3"/>
      <!-- Ondes sonores -->
      <path d="M12,-6 A10,10 0 0,1 12,6" stroke="#92400e" stroke-width="1" fill="none"/>
      <path d="M16,-8 A14,14 0 0,1 16,8" stroke="#92400e" stroke-width="0.8" fill="none"/>
    </g>

    <!-- ══ Antenne IEC ══ -->
    <g id="sym-antenna">
      <circle cx="0" cy="0" r="18" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.8"/>
      <!-- Antenne rayonnante IEC -->
      <line x1="0" y1="6" x2="0" y2="-4" stroke="#4338ca" stroke-width="1.8"/>
      <line x1="-8" y1="-4" x2="0" y2="-10" stroke="#4338ca" stroke-width="1.5"/>
      <line x1="8" y1="-4" x2="0" y2="-10" stroke="#4338ca" stroke-width="1.5"/>
      <!-- Ondes -->
      <path d="M-6,-12 A12,12 0 0,1 6,-12" stroke="#4338ca" stroke-width="0.8" fill="none"/>
    </g>

    <!-- ══ Carte SD IEC ══ -->
    <g id="sym-sd">
      <rect x="-18" y="-14" width="36" height="28" rx="3" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.8"/>
      <!-- Bord coupé carte SD -->
      <path d="M-15,-14 L8,-14 L18,-4 L18,14 L-15,14 Z" fill="none" stroke="#7e22ce" stroke-width="1"/>
      <text x="0" y="3" text-anchor="middle" font-size="9" font-weight="bold" fill="#7e22ce">SD</text>
    </g>
  </defs>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TITRE                                                    -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="370" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">
    Architecture de la boucle — ESP32 embarqué
  </text>
  <text x="370" y="42" text-anchor="middle" font-size="11" fill="#64748b">
    Alimentation : batterie Makita 18 V → DC-DC 5 V · Symboles IEC 60617
  </text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BLOC ESP32 (IC IEC avec encoche)                          -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="220" y="60" width="300" height="310" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <!-- Encoche IC -->
  <path d="M355,60 A15,15 0 0,0 385,60" stroke="#4f46e5" stroke-width="2.5" fill="#eef2ff"/>
  <text x="370" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">ESP32-WROOM-32</text>
  <text x="370" y="104" text-anchor="middle" font-size="10" fill="#6366f1">2× Xtensa LX6 · 240 MHz · Wi-Fi</text>

  <!-- Séparateurs internes -->
  <line x1="235" y1="115" x2="505" y2="115" stroke="#c7d2fe" stroke-width="1"/>
  <text x="290" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#4f46e5">ADC (12 bits)</text>
  <text x="440" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">PWM / GPIO</text>
  <line x1="365" y1="115" x2="365" y2="340" stroke="#c7d2fe" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- CAPTEURS IEC (gauche)                                     -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="90" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">CAPTEURS</text>

  <!-- ADC0 — Pirani -->
  <use href="#sym-pressure" x="60" y="148"/>
  <text x="60" y="172" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">Pirani</text>
  <text x="60" y="183" text-anchor="middle" font-size="8" fill="#92400e">0–1000 mbar</text>
  <line x1="76" y1="148" x2="220" y2="148" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrIn)"/>
  <text x="228" y="143" font-size="9" fill="#4f46e5" font-weight="bold">ADC0</text>

  <!-- ADC1 — Caméra -->
  <use href="#sym-photo" x="60" y="196"/>
  <text x="60" y="220" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">Caméra</text>
  <text x="60" y="231" text-anchor="middle" font-size="8" fill="#1d4ed8">luminosité</text>
  <line x1="76" y1="196" x2="220" y2="196" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrIn)"/>
  <text x="228" y="191" font-size="9" fill="#4f46e5" font-weight="bold">ADC1</text>

  <!-- ADC2 — Coupleur directionnel -->
  <use href="#sym-coupler" x="60" y="244"/>
  <text x="60" y="268" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">Coupleur dir.</text>
  <text x="60" y="279" text-anchor="middle" font-size="8" fill="#92400e">P réfléchie</text>
  <line x1="76" y1="244" x2="220" y2="244" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrIn)"/>
  <text x="228" y="239" font-size="9" fill="#4f46e5" font-weight="bold">ADC2</text>

  <!-- ADC3 — Thermocouple K -->
  <use href="#sym-thermo" x="60" y="292"/>
  <text x="60" y="316" text-anchor="middle" font-size="9" fill="#0f766e" font-weight="bold">Thermo K</text>
  <text x="60" y="327" text-anchor="middle" font-size="8" fill="#0f766e">MAX6675</text>
  <line x1="76" y1="292" x2="220" y2="292" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#arrIn)"/>
  <text x="228" y="287" font-size="9" fill="#4f46e5" font-weight="bold">ADC3</text>

  <!-- ADC4 — V batterie -->
  <use href="#sym-volt" x="60" y="340"/>
  <text x="60" y="364" text-anchor="middle" font-size="9" fill="#991b1b" font-weight="bold">V batterie</text>
  <text x="60" y="375" text-anchor="middle" font-size="8" fill="#991b1b">diviseur R</text>
  <line x1="76" y1="340" x2="220" y2="340" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrIn)"/>
  <text x="228" y="335" font-size="9" fill="#4f46e5" font-weight="bold">ADC4</text>

  <!-- ADC5 — NTC -->
  <use href="#sym-ntc" x="60" y="388"/>
  <text x="60" y="412" text-anchor="middle" font-size="9" fill="#9d174d" font-weight="bold">NTC</text>
  <text x="60" y="423" text-anchor="middle" font-size="8" fill="#9d174d">T° batt/ond.</text>
  <line x1="76" y1="388" x2="220" y2="388" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrIn)"/>
  <text x="228" y="383" font-size="9" fill="#4f46e5" font-weight="bold">ADC5</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ACTIONNEURS IEC (droite)                                  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="650" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">ACTIONNEURS</text>

  <!-- PWM0 — Électrovanne -->
  <text x="500" y="168" font-size="9" fill="#15803d" font-weight="bold">PWM0</text>
  <line x1="520" y1="175" x2="604" y2="175" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrOut)"/>
  <use href="#sym-valve" x="630" y="175"/>
  <text x="660" y="175" text-anchor="start" font-size="9" fill="#15803d" font-weight="bold">Électrovanne</text>
  <text x="660" y="188" text-anchor="start" font-size="8" fill="#15803d">H₂O solénoïde</text>

  <!-- PWM1 — SSR Magnétron -->
  <text x="500" y="228" font-size="9" fill="#15803d" font-weight="bold">PWM1</text>
  <line x1="520" y1="235" x2="604" y2="235" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrOut)"/>
  <use href="#sym-ssr" x="630" y="235"/>
  <text x="660" y="235" text-anchor="start" font-size="9" fill="#991b1b" font-weight="bold">SSR</text>
  <text x="660" y="248" text-anchor="start" font-size="8" fill="#991b1b">magnétron</text>

  <!-- GPIO — Alarme -->
  <text x="500" y="288" font-size="9" fill="#15803d" font-weight="bold">GPIO</text>
  <line x1="520" y1="295" x2="604" y2="295" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrOut)"/>
  <use href="#sym-alarm" x="630" y="295"/>
  <text x="660" y="295" text-anchor="start" font-size="9" fill="#92400e" font-weight="bold">Alarme</text>
  <text x="660" y="308" text-anchor="start" font-size="8" fill="#92400e">LED + buzzer</text>

  <!-- Wi-Fi — MQTT -->
  <text x="500" y="338" font-size="9" fill="#4f46e5" font-weight="bold">Wi-Fi</text>
  <line x1="520" y1="345" x2="600" y2="345" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrOut)"/>
  <use href="#sym-antenna" x="630" y="345"/>
  <text x="660" y="345" text-anchor="start" font-size="9" fill="#4338ca" font-weight="bold">MQTT</text>
  <text x="660" y="358" text-anchor="start" font-size="8" fill="#4338ca">dashboard</text>

  <!-- SPI — Carte SD -->
  <text x="500" y="388" font-size="9" fill="#7e22ce" font-weight="bold">SPI</text>
  <line x1="520" y1="395" x2="608" y2="395" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrOut)"/>
  <use href="#sym-sd" x="630" y="395"/>
  <text x="660" y="395" text-anchor="start" font-size="9" fill="#7e22ce" font-weight="bold">CSV log</text>
  <text x="660" y="408" text-anchor="start" font-size="8" fill="#7e22ce">carte µSD</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- WATCHDOG                                                  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="240" y="388" width="200" height="30" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="340" y="407" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">
    ⚠ Watchdog — coupe SSR si anomalie
  </text>
  <line x1="340" y1="370" x2="340" y2="388" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrR)"/>

  <!-- Légende symbolique -->
  <g transform="translate(20,440)" font-size="8" fill="#64748b">
    <text x="0" y="0">○ Capteur IEC 60617</text>
    <text x="120" y="0">□ Actionneur IEC 60617</text>
    <text x="260" y="0">⤞ Signal analogique</text>
    <text x="380" y="0">┈ ┈ Liaison sans fil</text>
    <text x="500" y="0">▶ Sens du flux</text>
  </g>
</svg>
