<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="'Segoe UI', Arial, sans-serif" font-size="11">
  <title>Chaîne RF simplifiée — Vue en élévation (coupe latérale)</title>

  <!-- Fond -->
  <rect width="700" height="420" fill="#ffffff"/>

  <!-- Titre -->
  <text x="350" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Chaîne RF — Vue en élévation (coupe latérale)</text>
  <text x="350" y="40" text-anchor="middle" font-size="10" fill="#64748b">Sans circulateur — Magnétron consommable + soft-start SSR</text>

  <!-- Ligne du couvercle (repère physique) -->
  <line x1="20" y1="230" x2="680" y2="230" stroke="#475569" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="350" y="245" text-anchor="middle" font-size="10" fill="#475569" font-weight="bold">▬ COUVERCLE (plan de séparation atm / vide) ▬</text>

  <!-- Zone ATMOSPHÈRE (au-dessus) -->
  <text x="50" y="68" font-size="10" fill="#64748b" font-weight="bold">PRESSION ATMOSPHÉRIQUE</text>

  <!-- Zone VIDE (en dessous) -->
  <text x="50" y="268" font-size="10" fill="#7c3aed" font-weight="bold">VIDE (2–5 mbar)</text>

  <!-- ═══ COMPOSANTS AU-DESSUS DU COUVERCLE ═══ -->

  <!-- MAGNÉTRON (au-dessus, centré) -->
  <rect x="240" y="80" width="160" height="70" rx="6" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <text x="320" y="105" text-anchor="middle" font-weight="bold" fill="white" font-size="13">MAGNÉTRON</text>
  <text x="320" y="120" text-anchor="middle" fill="#fecaca" font-size="9">LG 2M213-01TAG ~700 W</text>
  <text x="320" y="133" text-anchor="middle" fill="#fecaca" font-size="8">consommable (~15 $) — 0,9 kg</text>

  <!-- Antenne magnétron (pénètre le couvercle) -->
  <rect x="310" y="150" width="20" height="80" rx="3" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="350" y="185" font-size="8" fill="#b91c1c">antenne</text>
  <text x="350" y="195" font-size="8" fill="#b91c1c">λ/4</text>

  <!-- COUPLEUR DIRECTIONNEL (au-dessus, à droite du magnétron) -->
  <rect x="460" y="100" width="130" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="525" y="120" text-anchor="middle" font-weight="bold" fill="#92400e" font-size="11">COUPLEUR DIR.</text>
  <text x="525" y="135" text-anchor="middle" fill="#92400e" font-size="9">−20 dB → ESP32 ADC</text>

  <!-- Lien coupleur ↔ magnétron (guide d'onde conceptuel) -->
  <line x1="400" y1="120" x2="460" y2="120" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber2)"/>
  <text x="430" y="112" text-anchor="middle" font-size="8" fill="#92400e">WR-340</text>

  <!-- IRIS / GRILLAGE (dans le plan du couvercle) -->
  <rect x="260" y="222" width="120" height="16" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="320" y="218" text-anchor="middle" font-weight="bold" fill="#475569" font-size="9">IRIS (grillage maillé)</text>

  <!-- ═══ COMPOSANTS EN DESSOUS DU COUVERCLE (VIDE) ═══ -->

  <!-- CAVITÉ PLASMA (chambre inox) -->
  <rect x="170" y="260" width="300" height="110" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <ellipse cx="320" cy="315" rx="120" ry="40" fill="url(#plasmaGrad2)" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="320" y="285" text-anchor="middle" font-weight="bold" fill="#7c3aed" font-size="12">CAVITÉ PLASMA</text>
  <text x="320" y="300" text-anchor="middle" fill="#7c3aed" font-size="9">Chambre inox ⌀250×250</text>
  <text x="320" y="340" text-anchor="middle" fill="#a855f7" font-size="9">Plasma H₂O (2–5 mbar)</text>
  <text x="320" y="355" text-anchor="middle" fill="#a855f7" font-size="8">Zone de gradient d'indice n → 0</text>

  <!-- Capteur spectral (sur la paroi, dans le vide) -->
  <rect x="490" y="290" width="100" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="540" y="307" text-anchor="middle" font-weight="bold" fill="#1e40af" font-size="9">AS7343</text>
  <text x="540" y="320" text-anchor="middle" fill="#1e40af" font-size="8">Spectral (Hα, OH·)</text>
  <line x1="490" y1="310" x2="470" y2="315" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Sonde de pression (sur la paroi, dans le vide) -->
  <rect x="90" y="290" width="80" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="130" y="307" text-anchor="middle" font-weight="bold" fill="#92400e" font-size="9">ZJ-52T</text>
  <text x="130" y="320" text-anchor="middle" fill="#92400e" font-size="8">Pression vide</text>
  <line x1="170" y1="310" x2="170" y2="310" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Annotation : puissance réfléchie -->
  <path d="M315,260 Q310,200 300,155" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowRedD2)"/>
  <text x="280" y="200" font-size="8" fill="#dc2626" transform="rotate(-75,280,200)">P_r → anode</text>

  <!-- Encadré soft-start -->
  <rect x="40" y="375" width="620" height="35" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="350" y="390" text-anchor="middle" font-size="10" fill="#14532d" font-weight="bold">💡 Le magnétron et le coupleur sont TOUS au-dessus du couvercle — pas de circulateur, pas de charge à eau</text>
  <text x="350" y="403" text-anchor="middle" font-size="9" fill="#14532d">Protection unique : firmware soft-start SSR (rampe duty 3 % → 43 %) — masse ajoutée au pendule : 0 kg</text>

  <!-- Légende numérotée -->
  <text x="235" y="78" font-size="9" fill="#b91c1c" font-weight="bold">①</text>
  <text x="455" y="98" font-size="9" fill="#92400e" font-weight="bold">②</text>
  <text x="248" y="218" font-size="9" fill="#475569" font-weight="bold">③</text>
  <text x="158" y="275" font-size="9" fill="#7c3aed" font-weight="bold">④</text>

  <!-- Defs -->
  <defs>
    <marker id="arrowAmber2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRedD2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <radialGradient id="plasmaGrad2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#faf5ff" stop-opacity="0.05"/>
    </radialGradient>
  </defs>
</svg>
