<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 720" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">
  <rect width="100%" height="100%" fill="white"/>
  <title>P&amp;ID — Circuit fluidique H₂O (2 vannes + septum dans le tube)</title>
  <style>
    text   { fill: #222; }
    .box   { fill: none; stroke: #222; stroke-width: 1.6; rx: 7; }
    .valve { fill: none; stroke: #222; stroke-width: 1.6; rx: 5;
             stroke-dasharray: 7,3; }
    .tube  { stroke: #222; stroke-width: 2; fill: none; }
    .lbl   { font-size: 10px; fill: #555; opacity: 0.65; }
    .title { font-size: 14px; font-weight: 700; }
    .sub   { font-size: 11px; fill: #555; opacity: 0.75; }
    .bold  { font-weight: 700; }
  </style>

  <!-- Titre -->
  <text x="220" y="24" text-anchor="middle" class="title">P&amp;ID — Circuit fluidique H₂O</text>
  <text x="220" y="42" text-anchor="middle" class="sub">(2 vannes + septum dans le tube de pompage)</text>

  <!-- CHAMBRE -->
  <rect class="box" x="120" y="60" width="200" height="64"/>
  <text x="220" y="82" text-anchor="middle" class="bold">CHAMBRE À VIDE</text>
  <text x="220" y="96" text-anchor="middle" class="lbl">V = 11,4 L · P = 2–5 mbar</text>
  <text x="220" y="110" text-anchor="middle" class="lbl">Plasma H₂O</text>

  <!-- Tube chambre → V₂ -->
  <line class="tube" x1="220" y1="124" x2="220" y2="154"/>

  <!-- V₂ -->
  <rect class="valve" x="140" y="154" width="160" height="38"/>
  <text x="220" y="170" text-anchor="middle" class="bold">V₂ — VANNE CHAMBRE</text>
  <text x="220" y="184" text-anchor="middle" class="lbl">DN10 (¼ tour)</text>

  <!-- Tube V₂ → septum -->
  <line class="tube" x1="220" y1="192" x2="220" y2="232"/>
  <text x="235" y="210" class="lbl">tube ⌀ 8 mm</text>
  <text x="235" y="224" class="lbl">(sas ~100 mm)</text>

  <!-- Septum -->
  <rect class="box" x="140" y="232" width="160" height="38" stroke-width="2.2"/>
  <text x="220" y="248" text-anchor="middle" class="bold">RACCORD SEPTUM</text>
  <text x="220" y="262" text-anchor="middle" class="lbl">silicone ⌀ 10 mm (dans le tube)</text>

  <!-- Seringue (latérale) -->
  <line class="tube" x1="68" y1="251" x2="140" y2="251"/>
  <polygon points="136,246 144,251 136,256" fill="#222"/>
  <rect class="box" x="6" y="232" width="62" height="38"/>
  <text x="37" y="248" text-anchor="middle" class="bold" font-size="10">MICRO-</text>
  <text x="37" y="262" text-anchor="middle" class="lbl">50 µL, 30G</text>

  <!-- Tube septum → V₁ -->
  <line class="tube" x1="220" y1="270" x2="220" y2="310"/>
  <text x="235" y="294" class="lbl">tube ⌀ 8 mm</text>

  <!-- V₁ -->
  <rect class="valve" x="140" y="310" width="160" height="38"/>
  <text x="220" y="326" text-anchor="middle" class="bold">V₁ — VANNE POMPE</text>
  <text x="220" y="340" text-anchor="middle" class="lbl">DN10 (¼ tour)</text>

  <!-- Tube V₁ → Pirani -->
  <line class="tube" x1="220" y1="348" x2="220" y2="384"/>

  <!-- Pirani -->
  <rect class="box" x="140" y="384" width="160" height="52"/>
  <text x="220" y="403" text-anchor="middle" class="bold">JAUGE PIRANI</text>
  <text x="220" y="417" text-anchor="middle" class="lbl">10⁻³–100 mbar</text>
  <text x="220" y="430" text-anchor="middle" class="lbl">→ ADS1115 → ESP32</text>

  <!-- Tube Pirani → Piège -->
  <line class="tube" x1="220" y1="436" x2="220" y2="470"/>

  <!-- Piège froid -->
  <rect class="box" x="140" y="470" width="160" height="42" stroke-dasharray="4,4" opacity="0.55"/>
  <text x="220" y="490" text-anchor="middle" class="lbl">PIÈGE FROID (optionnel)</text>
  <text x="220" y="504" text-anchor="middle" class="lbl">(si pompe à huile)</text>

  <!-- Tube Piège → Pompe -->
  <line class="tube" x1="220" y1="512" x2="220" y2="546"/>
  <text x="240" y="534" class="lbl">raccord rapide</text>

  <!-- Pompe -->
  <rect class="box" x="140" y="546" width="160" height="44"/>
  <text x="220" y="565" text-anchor="middle" class="bold">POMPE À VIDE</text>
  <text x="220" y="580" text-anchor="middle" class="lbl">membrane ≥ 10 L/min</text>

  <!-- Tube Pompe → atmosphère -->
  <line class="tube" x1="220" y1="590" x2="220" y2="620"/>
  <polygon points="215,616 220,626 225,616" fill="#222"/>
  <text x="220" y="644" text-anchor="middle" class="lbl">atmosphère</text>

  <!-- Légende points clés -->
  <rect x="320" y="100" width="112" height="130" rx="6" fill="none"
        stroke="#222" stroke-width="1" opacity="0.35"/>
  <text x="376" y="118" text-anchor="middle" class="bold" font-size="10">Points clés</text>
  <text x="328" y="136" class="lbl" font-size="10">① 1 seul port dans</text>
  <text x="340" y="148" class="lbl" font-size="10">le couvercle</text>
  <text x="328" y="166" class="lbl" font-size="10">② Sas V₁–V₂ =</text>
  <text x="340" y="178" class="lbl" font-size="10">port d'injection</text>
  <text x="328" y="196" class="lbl" font-size="10">③ 0 g embarqué</text>
  <text x="328" y="214" class="lbl" font-size="10">④ Septum hors RF</text>
</svg>
