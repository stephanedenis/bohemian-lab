<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" font-family="'Segoe UI', Arial, sans-serif" font-size="12">
  <defs>
    <radialGradient id="chambreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="nixieGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Titre -->
  <text x="250" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Vue du dessus — 8× Nixie IN-13 (octogone)</text>
  <text x="250" y="42" text-anchor="middle" font-size="11" fill="#64748b">Chambre inox ⌀ 250 mm</text>

  <!-- Chambre (cercle) -->
  <circle cx="250" cy="270" r="180" fill="url(#chambreGrad)" stroke="#475569" stroke-width="4"/>

  <!-- Lignes de repère angulaire (pointillées) -->
  <g stroke="#cbd5e1" stroke-width="0.7" stroke-dasharray="4,4">
    <line x1="250" y1="90" x2="250" y2="450"/>
    <line x1="70" y1="270" x2="430" y2="270"/>
    <line x1="122.7" y1="142.7" x2="377.3" y2="397.3"/>
    <line x1="377.3" y1="142.7" x2="122.7" y2="397.3"/>
  </g>

  <!-- Nixie tubes (cercles + étiquettes) -->
  <!-- N₁ (0° = haut) -->
  <circle cx="250" cy="105" r="16" fill="#22c55e" stroke="#15803d" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="250" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₁</text>
  <text x="250" y="78" text-anchor="middle" font-size="10" fill="#15803d" font-weight="bold">0°</text>

  <!-- N₂ (45°) -->
  <circle cx="366.7" cy="153.3" r="16" fill="#22c55e" stroke="#15803d" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="366.7" y="158.3" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₂</text>
  <text x="388" y="138" font-size="10" fill="#15803d" font-weight="bold">45°</text>

  <!-- N₃ (90°) -->
  <circle cx="415" cy="270" r="16" fill="#22c55e" stroke="#15803d" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="415" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₃</text>
  <text x="442" y="272" font-size="10" fill="#15803d" font-weight="bold">90°</text>

  <!-- N₄ (135°) -->
  <circle cx="366.7" cy="386.7" r="16" fill="#22c55e" stroke="#15803d" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="366.7" y="391.7" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₄</text>
  <text x="388" y="404" font-size="10" fill="#15803d" font-weight="bold">135°</text>

  <!-- N₅ (180°) -->
  <circle cx="250" cy="435" r="16" fill="#22c55e" stroke="#15803d" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="250" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₅</text>
  <text x="250" y="465" text-anchor="middle" font-size="10" fill="#15803d" font-weight="bold">180°</text>

  <!-- N₆ (225°) -->
  <circle cx="133.3" cy="386.7" r="16" fill="#22c55e" stroke="#15803d" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="133.3" y="391.7" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₆</text>
  <text x="100" y="404" font-size="10" fill="#15803d" font-weight="bold">225°</text>

  <!-- N₇ (270°) -->
  <circle cx="85" cy="270" r="16" fill="#22c55e" stroke="#15803d" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="85" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₇</text>
  <text x="45" y="272" font-size="10" fill="#15803d" font-weight="bold">270°</text>

  <!-- N₈ (315°) -->
  <circle cx="133.3" cy="153.3" r="16" fill="#22c55e" stroke="#15803d" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="133.3" y="158.3" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₈</text>
  <text x="100" y="138" font-size="10" fill="#15803d" font-weight="bold">315°</text>

  <!-- Magnétron (position ~30° du N₁) -->
  <g transform="translate(310, 112)">
    <rect x="-15" y="-12" width="30" height="24" rx="4" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" font-size="9" font-weight="bold" fill="white">MAG</text>
  </g>
  <line x1="310" y1="124" x2="310" y2="140" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="345" y="110" font-size="10" fill="#b91c1c" font-weight="bold">⊕ Magnétron</text>
  <text x="345" y="123" font-size="9" fill="#b91c1c">(couplé à ~30° du N₁)</text>

  <!-- Centre -->
  <circle cx="250" cy="270" r="3" fill="#475569"/>
  <text x="262" y="280" font-size="9" fill="#475569">axe</text>

  <!-- Légende gradient -->
  <rect x="60" y="470" width="380" height="25" rx="5" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="250" y="487" text-anchor="middle" font-size="10" fill="#854d0e">La longueur de la colonne lumineuse de chaque Nₖ indique la densité n꜀ locale</text>
</svg>
