<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540" font-family="'Segoe UI', Arial, sans-serif" font-size="12">
  <rect width="520" height="540" fill="#ffffff"/>
  <defs>
    <radialGradient id="chambreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="nixieGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ff6b2b" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Titre -->
  <text x="260" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Vue du dessus — 8× Nixie IN-13 (octogone)</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#64748b">Chambre inox ⌀ 250 mm · Magnétron au-dessus du grillage (hors cage)</text>

  <!-- Chambre (cercle) -->
  <circle cx="260" cy="275" r="180" fill="url(#chambreGrad)" stroke="#475569" stroke-width="4"/>

  <!-- Lignes de repère angulaire (pointillées) -->
  <g stroke="#cbd5e1" stroke-width="0.7" stroke-dasharray="4,4">
    <line x1="260" y1="95" x2="260" y2="455"/>
    <line x1="80" y1="275" x2="440" y2="275"/>
    <line x1="132.7" y1="147.7" x2="387.3" y2="402.3"/>
    <line x1="387.3" y1="147.7" x2="132.7" y2="402.3"/>
  </g>

  <!-- Nixie tubes -->
  <!-- N₁ (0° = haut) -->
  <circle cx="260" cy="110" r="16" fill="#ff6b2b" stroke="#cc4400" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="260" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₁</text>
  <text x="260" y="83" text-anchor="middle" font-size="10" fill="#cc4400" font-weight="bold">0°</text>

  <!-- N₂ (45°) -->
  <circle cx="376.7" cy="158.3" r="16" fill="#ff6b2b" stroke="#cc4400" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="376.7" y="163.3" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₂</text>
  <text x="398" y="143" font-size="10" fill="#cc4400" font-weight="bold">45°</text>

  <!-- N₃ (90°) -->
  <circle cx="425" cy="275" r="16" fill="#ff6b2b" stroke="#cc4400" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="425" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₃</text>
  <text x="452" y="277" font-size="10" fill="#cc4400" font-weight="bold">90°</text>

  <!-- N₄ (135°) -->
  <circle cx="376.7" cy="391.7" r="16" fill="#ff6b2b" stroke="#cc4400" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="376.7" y="396.7" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₄</text>
  <text x="398" y="409" font-size="10" fill="#cc4400" font-weight="bold">135°</text>

  <!-- N₅ (180°) -->
  <circle cx="260" cy="440" r="16" fill="#ff6b2b" stroke="#cc4400" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="260" y="445" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₅</text>
  <text x="260" y="470" text-anchor="middle" font-size="10" fill="#cc4400" font-weight="bold">180°</text>

  <!-- N₆ (225°) -->
  <circle cx="143.3" cy="391.7" r="16" fill="#ff6b2b" stroke="#cc4400" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="143.3" y="396.7" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₆</text>
  <text x="110" y="409" font-size="10" fill="#cc4400" font-weight="bold">225°</text>

  <!-- N₇ (270°) -->
  <circle cx="95" cy="275" r="16" fill="#ff6b2b" stroke="#cc4400" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="95" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₇</text>
  <text x="55" y="277" font-size="10" fill="#cc4400" font-weight="bold">270°</text>

  <!-- N₈ (315°) -->
  <circle cx="143.3" cy="158.3" r="16" fill="#ff6b2b" stroke="#cc4400" stroke-width="2" filter="url(#nixieGlow)"/>
  <text x="143.3" y="163.3" text-anchor="middle" font-size="11" font-weight="bold" fill="white">N₈</text>
  <text x="110" y="143" font-size="10" fill="#cc4400" font-weight="bold">315°</text>

  <!-- VANNE DN10 au centre du couvercle -->
  <circle cx="260" cy="275" r="22" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
  <text x="260" y="272" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Vanne</text>
  <text x="260" y="283" text-anchor="middle" font-size="9" font-weight="bold" fill="white">DN10</text>

  <!-- Magnétron au-dessus (position ~30° du N₁, symbolisé par un rectangle au-dessus) -->
  <g transform="translate(312, 115)">
    <rect x="-18" y="-14" width="36" height="28" rx="5" fill="#ef4444" stroke="#b91c1c" stroke-width="2" opacity="0.85"/>
    <text x="0" y="4" text-anchor="middle" font-size="9" font-weight="bold" fill="white">MAG</text>
  </g>
  <!-- Ligne pointillée indiquant que le magnétron est AU-DESSUS -->
  <line x1="312" y1="129" x2="312" y2="150" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="355" y="115" font-size="10" fill="#b91c1c" font-weight="bold">⊕ Magnétron</text>
  <text x="355" y="128" font-size="9" fill="#b91c1c">(au-dessus du grillage,</text>
  <text x="355" y="140" font-size="9" fill="#b91c1c"> iris à ~30° du N₁)</text>

  <!-- Légende -->
  <rect x="60" y="485" width="400" height="48" rx="5" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="260" y="503" text-anchor="middle" font-size="10" fill="#854d0e">Nₖ = IN-13 néon (passif, broches à la masse) · Lueur orange naturelle du néon</text>
  <text x="260" y="520" text-anchor="middle" font-size="10" fill="#854d0e">Le magnétron est monté au-dessus du grillage Faraday (hors cage), pas à l'intérieur</text>
</svg>
