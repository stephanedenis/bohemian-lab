<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="monospace" font-size="13">
  <rect width="100%" height="100%" fill="white"/>
  <title>Circuit d'injection — 2 vannes + septum dans le tube de pompage</title>

  <style>
    text { fill: #222; }
    .box   { fill: none; stroke: #222; stroke-width: 1.5; rx: 6; }
    .tube  { stroke: #222; stroke-width: 2.5; fill: none; }
    .arrow { fill: #222; }
    .label { font-size: 11px; fill: #555; opacity: 0.7; }
    .phase { font-size: 11px; font-weight: bold; }
  </style>

  <!-- CHAMBRE -->
  <rect class="box" x="220" y="10" width="160" height="60"/>
  <text x="300" y="34" text-anchor="middle" font-weight="bold">CHAMBRE</text>
  <text x="300" y="52" text-anchor="middle" class="label">11,4 L · 2–5 mbar</text>

  <!-- Tube chambre → V₂ -->
  <line class="tube" x1="300" y1="70" x2="300" y2="90"/>

  <!-- V₂ -->
  <rect class="box" x="240" y="90" width="120" height="36" stroke-dasharray="6,3"/>
  <text x="300" y="113" text-anchor="middle" font-weight="bold">V₂ (chambre)</text>

  <!-- Tube V₂ → septum -->
  <line class="tube" x1="300" y1="126" x2="300" y2="150"/>
  <text x="315" y="142" class="label">tube ⌀ 8 mm</text>

  <!-- Septum (raccord en T) -->
  <rect class="box" x="230" y="150" width="140" height="40" stroke="#222" stroke-width="2"/>
  <text x="300" y="175" text-anchor="middle" font-weight="bold">SEPTUM</text>

  <!-- Seringue (flèche latérale) -->
  <line class="tube" x1="175" y1="170" x2="230" y2="170"/>
  <polygon points="228,166 236,170 228,174" fill="#222"/>
  <text x="90" y="160" font-weight="bold">Seringue</text>
  <text x="90" y="175" class="label">50 µL, 30G</text>

  <!-- Tube septum → V₁ -->
  <line class="tube" x1="300" y1="190" x2="300" y2="210"/>
  <text x="315" y="204" class="label">sas ~100 mm</text>

  <!-- V₁ -->
  <rect class="box" x="240" y="210" width="120" height="36" stroke-dasharray="6,3"/>
  <text x="300" y="233" text-anchor="middle" font-weight="bold">V₁ (pompe)</text>

  <!-- Tube V₁ → Pirani -->
  <line class="tube" x1="300" y1="246" x2="300" y2="264"/>

  <!-- Pirani -->
  <rect class="box" x="245" y="264" width="110" height="30"/>
  <text x="300" y="284" text-anchor="middle" class="label">Pirani</text>

  <!-- Tube Pirani → Pompe -->
  <line class="tube" x1="300" y1="294" x2="300" y2="310"/>
  <polygon points="296,306 300,316 304,306" fill="#222"/>
  <text x="315" y="316" class="label">→ pompe</text>

  <!-- Phases à droite -->
  <text x="440" y="40" class="phase">① V₁+V₂ ouvertes → pomper</text>
  <text x="440" y="60" class="phase">② Fermer V₁ (isoler pompe)</text>
  <text x="440" y="80" class="phase">③ Piquer septum, injecter</text>
  <text x="440" y="100" class="phase">④ Fermer V₂ (sceller)</text>
  <text x="440" y="120" class="phase">⑤ Déconnecter tuyau</text>
</svg>
