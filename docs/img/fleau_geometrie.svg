<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Segoe UI', Arial, sans-serif" font-size="12">
  <rect width="600" height="380" fill="#ffffff"/>
  <defs>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Titre -->
  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Géométrie du plateau porteur — Vue du dessus</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#64748b">Balance de torsion type Cavendish (d = 200 mm)</text>

  <!-- Baril -->
  <rect x="50" y="55" width="500" height="280" rx="12" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="300" y="74" text-anchor="middle" font-size="11" fill="#64748b">Baril 205L — ⌀ 580 mm</text>

  <!-- Fil de torsion -->
  <line x1="300" y1="80" x2="300" y2="120" stroke="#a16207" stroke-width="2"/>
  <circle cx="300" cy="80" r="5" fill="#a16207" stroke="#854d0e" stroke-width="1.5"/>
  <text x="315" y="84" font-size="10" fill="#854d0e" font-weight="bold">Fil de torsion</text>
  <text x="315" y="96" font-size="9" fill="#854d0e">(axe de rotation)</text>

  <!-- Fléau -->
  <rect x="105" y="185" width="390" height="12" rx="3" fill="#78716c" stroke="#44403c" stroke-width="2"/>
  <line x1="300" y1="120" x2="300" y2="185" stroke="#a16207" stroke-width="2"/>
  <text x="300" y="212" text-anchor="middle" font-size="10" fill="#44403c" font-weight="bold">PLATEAU PORTEUR (400 mm)</text>

  <!-- Point de pivot -->
  <circle cx="300" cy="191" r="6" fill="#1e293b" stroke="white" stroke-width="2"/>
  <text x="300" y="194" text-anchor="middle" font-size="7" fill="white">●</text>

  <!-- Chambre inox (gauche) -->
  <rect x="120" y="120" width="130" height="130" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
  <text x="185" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Chambre</text>
  <text x="185" y="185" text-anchor="middle" font-size="11" fill="#475569">inox</text>
  <text x="185" y="200" text-anchor="middle" font-size="10" fill="#475569">⌀ 250 mm</text>

  <!-- Contrepoids (droite) -->
  <rect x="370" y="135" width="110" height="110" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="425" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Contre-</text>
  <text x="425" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">poids</text>
  <text x="425" y="210" text-anchor="middle" font-size="10" fill="#991b1b">~ 10 kg</text>

  <!-- Cotes 200 mm -->
  <!-- Gauche -->
  <line x1="185" y1="260" x2="185" y2="275" stroke="#1e293b" stroke-width="1"/>
  <line x1="300" y1="260" x2="300" y2="275" stroke="#1e293b" stroke-width="1"/>
  <line x1="185" y1="270" x2="300" y2="270" stroke="#1e293b" stroke-width="1.5" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
  <text x="242" y="267" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b" style="background:white">← 200 mm →</text>
  <defs>
    <marker id="arrowL" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6" fill="#1e293b"/></marker>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#1e293b"/></marker>
  </defs>

  <!-- Droite -->
  <line x1="300" y1="260" x2="300" y2="275" stroke="#1e293b" stroke-width="1"/>
  <line x1="425" y1="260" x2="425" y2="275" stroke="#1e293b" stroke-width="1"/>
  <line x1="300" y1="270" x2="425" y2="270" stroke="#1e293b" stroke-width="1.5"/>
  <text x="362" y="267" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">← 200 mm →</text>

  <!-- Miroir -->
  <rect x="290" y="155" width="20" height="8" rx="1" fill="#fbbf24" stroke="#a16207" stroke-width="1.5" transform="rotate(45, 300, 159)"/>
  <text x="318" y="150" font-size="9" fill="#a16207" font-weight="bold">[M] Miroir</text>

  <!-- Laser + PSD -->
  <g transform="translate(80, 310)">
    <rect x="0" y="0" width="60" height="20" rx="4" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
    <text x="30" y="14" text-anchor="middle" font-size="9" font-weight="bold" fill="white">Laser</text>
  </g>
  <line x1="140" y1="320" x2="290" y2="162" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="310" y1="155" x2="460" y2="320" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3"/>
  <g transform="translate(460, 310)">
    <rect x="0" y="0" width="60" height="20" rx="4" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
    <text x="30" y="14" text-anchor="middle" font-size="9" font-weight="bold" fill="white">PSD</text>
  </g>
  <text x="300" y="345" text-anchor="middle" font-size="9" fill="#047857">(Laser et PSD fixés à la paroi interne du baril)</text>
</svg>
