<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" font-family="'Segoe UI', Arial, sans-serif" font-size="11">
  <rect width="600" height="580" fill="#ffffff"/>
  <defs>
    <g id="magnetron">
      <circle r="8" fill="#ef4444" stroke="#b91c1c" stroke-width="0.8"/>
      <circle cx="0" cy="-4.5" r="1.4" fill="#7f1d1d"/>
      <circle cx="3.9" cy="-2.25" r="1.4" fill="#7f1d1d"/>
      <circle cx="3.9" cy="2.25" r="1.4" fill="#7f1d1d"/>
      <circle cx="0" cy="4.5" r="1.4" fill="#7f1d1d"/>
      <circle cx="-3.9" cy="2.25" r="1.4" fill="#7f1d1d"/>
      <circle cx="-3.9" cy="-2.25" r="1.4" fill="#7f1d1d"/>
      <circle r="2" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.5"/>
    </g>
  </defs>
  <!-- Titre -->
  <text x="300" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Vue du dessus — Plan d'implantation</text>
  <text x="300" y="40" text-anchor="middle" font-size="11" fill="#64748b">Baril ⌀ 580 mm · Magnétron au-dessus du grillage (hors cage)</text>

  <!-- Baril (cercle) -->
  <circle cx="300" cy="280" r="240" fill="#fafaf9" stroke="#57534e" stroke-width="4"/>

  <!-- Barre transversale (fixée aux parois du baril, supporte le fil) -->
  <rect x="60" y="277" width="480" height="6" rx="2" fill="#78716c" stroke="#44403c" stroke-width="1" opacity="0.4"/>
  <text x="540" y="283" font-size="7" fill="#57534e">barre transv.</text>

  <!-- Fil de torsion (axe central) -->
  <circle cx="300" cy="280" r="5" fill="#a16207" stroke="#854d0e" stroke-width="2"/>
  <text x="315" y="287" font-size="9" fill="#854d0e">fil de torsion</text>

  <!-- Plateau porteur (horizontal) -->
  <rect x="100" y="276" width="400" height="8" rx="2" fill="#78716c" stroke="#44403c" stroke-width="1.5"/>
  <text x="300" y="270" text-anchor="middle" font-size="9" fill="#44403c" font-weight="bold">PLATEAU PORTEUR</text>

  <!-- CÔTÉ A -->
  <text x="200" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">CÔTÉ A</text>

  <!-- Chambre inox (gauche) -->
  <circle cx="200" cy="280" r="90" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
  <text x="200" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">Chambre</text>
  <text x="200" y="285" text-anchor="middle" font-size="11" fill="#475569">inox</text>
  <text x="200" y="300" text-anchor="middle" font-size="10" fill="#475569">⌀ 250 mm</text>

  <!-- Vanne DN10 au centre du couvercle (vue de dessus = au centre de la chambre) -->
  <circle cx="200" cy="280" r="12" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
  <text x="200" y="284" text-anchor="middle" font-size="7" font-weight="bold" fill="white">DN10</text>

  <!-- Nixie positions (dans la chambre) -->
  <g font-size="8" font-weight="bold">
    <circle cx="200" cy="205" r="8" fill="#ff6b2b" stroke="#cc4400" stroke-width="1.5"/>
    <text x="200" y="208" text-anchor="middle" fill="white">N₁</text>
    <circle cx="257" cy="223" r="8" fill="#ff6b2b" stroke="#cc4400" stroke-width="1.5"/>
    <text x="257" y="226" text-anchor="middle" fill="white">N₂</text>
    <circle cx="275" cy="280" r="8" fill="#ff6b2b" stroke="#cc4400" stroke-width="1.5"/>
    <text x="275" y="283" text-anchor="middle" fill="white">N₃</text>
    <circle cx="257" cy="337" r="8" fill="#ff6b2b" stroke="#cc4400" stroke-width="1.5"/>
    <text x="257" y="340" text-anchor="middle" fill="white">N₄</text>
    <circle cx="200" cy="355" r="8" fill="#ff6b2b" stroke="#cc4400" stroke-width="1.5"/>
    <text x="200" y="358" text-anchor="middle" fill="white">N₅</text>
    <circle cx="143" cy="337" r="8" fill="#ff6b2b" stroke="#cc4400" stroke-width="1.5"/>
    <text x="143" y="340" text-anchor="middle" fill="white">N₆</text>
    <circle cx="125" cy="280" r="8" fill="#ff6b2b" stroke="#cc4400" stroke-width="1.5"/>
    <text x="125" y="283" text-anchor="middle" fill="white">N₇</text>
    <circle cx="143" cy="223" r="8" fill="#ff6b2b" stroke="#cc4400" stroke-width="1.5"/>
    <text x="143" y="226" text-anchor="middle" fill="white">N₈</text>
  </g>

  <!-- Magnétron (au-dessus du grillage, ~30° du N₁ — cercle à cavités, semi-transparent) -->
  <use href="#magnetron" x="221" y="204" opacity="0.8"/>
  <text x="237" y="199" font-size="8" fill="#b91c1c" font-weight="bold">⊕ mag</text>
  <text x="237" y="210" font-size="7" fill="#b91c1c">(sur grillage)</text>

  <!-- CÔTÉ B -->
  <text x="420" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">CÔTÉ B</text>

  <!-- Contrepoids (droite) -->
  <rect x="370" y="240" width="100" height="80" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="420" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Contrepoids</text>
  <text x="420" y="283" text-anchor="middle" font-size="10" fill="#991b1b">~ 10 kg</text>
  <text x="420" y="298" text-anchor="middle" font-size="7" fill="#7f1d1d">🔋⚡🖥 intégrés</text>

  <!-- Miroir -->
  <rect x="310" y="270" width="14" height="8" rx="1" fill="#fbbf24" stroke="#a16207" stroke-width="1.5" transform="rotate(45, 317, 274)"/>
  <text x="305" y="262" font-size="8" fill="#a16207" font-weight="bold">[M]</text>

  <!-- Laser (fixé sur paroi du baril) -->
  <rect x="65" y="430" width="48" height="18" rx="4" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
  <text x="89" y="443" text-anchor="middle" font-size="8" font-weight="bold" fill="white">Laser</text>
  <line x1="89" y1="430" x2="313" y2="278" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- PSD (fixé sur paroi du baril) -->
  <rect x="490" y="430" width="42" height="18" rx="4" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
  <text x="511" y="443" text-anchor="middle" font-size="8" font-weight="bold" fill="white">PSD</text>
  <line x1="321" y1="276" x2="490" y2="439" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- Cote dégagement 90 mm -->
  <g font-size="9" fill="#64748b">
    <text x="305" y="175" text-anchor="middle">90 mm</text>
    <text x="305" y="186" text-anchor="middle" font-size="8">dégagement</text>
    <text x="305" y="395" text-anchor="middle">90 mm</text>
    <text x="305" y="406" text-anchor="middle" font-size="8">dégagement</text>
  </g>

  <!-- Légende -->
  <rect x="80" y="500" width="440" height="80" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="517" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">Légende</text>
  <circle cx="120" cy="537" r="6" fill="#ff6b2b" stroke="#cc4400" stroke-width="1"/>
  <text x="135" y="541" font-size="9" fill="#1e293b">Nₖ = IN-13 néon (paroi int.)</text>
  <circle cx="265" cy="537" r="5" fill="#ef4444" stroke="#b91c1c" stroke-width="1" opacity="0.8"/>
  <text x="279" y="541" font-size="9" fill="#1e293b">⊕ = magnétron (au-dessus)</text>
  <circle cx="120" cy="557" r="6" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <text x="135" y="561" font-size="9" fill="#1e293b">DN10 = vanne (centre couvercle)</text>
  <circle cx="310" cy="557" r="4" fill="#a16207"/>
  <text x="320" y="561" font-size="9" fill="#1e293b">● = axe torsion</text>
  <rect x="410" y="553" width="10" height="8" rx="1" fill="#fbbf24" stroke="#a16207" stroke-width="1"/>
  <text x="427" y="561" font-size="9" fill="#1e293b">[M] = miroir (haut de tige)</text>
  <rect x="109" y="570" width="16" height="10" rx="2" fill="#10b981" stroke="#047857" stroke-width="1"/>
  <text x="135" y="578" font-size="9" fill="#1e293b">Laser / PSD (paroi baril)</text>
</svg>
