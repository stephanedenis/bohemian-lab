<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Segoe UI', Arial, sans-serif" font-size="11">
  <!-- Titre -->
  <text x="300" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Vue du dessus — Plan d'implantation</text>
  <text x="300" y="40" text-anchor="middle" font-size="11" fill="#64748b">Baril ⌀ 580 mm</text>

  <!-- Baril (cercle) -->
  <circle cx="300" cy="280" r="240" fill="#fafaf9" stroke="#57534e" stroke-width="4"/>

  <!-- Fil de torsion (axe central) -->
  <circle cx="300" cy="280" r="5" fill="#a16207" stroke="#854d0e" stroke-width="2"/>
  <text x="315" y="275" font-size="9" fill="#854d0e" font-weight="bold">●</text>
  <text x="315" y="287" font-size="9" fill="#854d0e">fil de torsion</text>

  <!-- Fléau (horizontal) -->
  <rect x="100" y="276" width="400" height="8" rx="2" fill="#78716c" stroke="#44403c" stroke-width="1.5"/>

  <!-- CÔTÉ A -->
  <text x="200" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">CÔTÉ A</text>

  <!-- Chambre inox (gauche) -->
  <circle cx="200" cy="280" r="90" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="200" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Chambre</text>
  <text x="200" y="285" text-anchor="middle" font-size="11" fill="#1e40af">inox</text>
  <text x="200" y="300" text-anchor="middle" font-size="10" fill="#1e40af">⌀ 250 mm</text>

  <!-- Nixie positions (dans la chambre) -->
  <g font-size="8" font-weight="bold">
    <!-- N1 (haut) -->
    <circle cx="200" cy="205" r="8" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <text x="200" y="208" text-anchor="middle" fill="white">N₁</text>
    <!-- N2 -->
    <circle cx="257" cy="223" r="8" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <text x="257" y="226" text-anchor="middle" fill="white">N₂</text>
    <!-- N3 -->
    <circle cx="275" cy="280" r="8" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <text x="275" y="283" text-anchor="middle" fill="white">N₃</text>
    <!-- N4 -->
    <circle cx="257" cy="337" r="8" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <text x="257" y="340" text-anchor="middle" fill="white">N₄</text>
    <!-- N5 -->
    <circle cx="200" cy="355" r="8" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <text x="200" y="358" text-anchor="middle" fill="white">N₅</text>
    <!-- N6 -->
    <circle cx="143" cy="337" r="8" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <text x="143" y="340" text-anchor="middle" fill="white">N₆</text>
    <!-- N7 -->
    <circle cx="125" cy="280" r="8" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <text x="125" y="283" text-anchor="middle" fill="white">N₇</text>
    <!-- N8 -->
    <circle cx="143" cy="223" r="8" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <text x="143" y="226" text-anchor="middle" fill="white">N₈</text>
  </g>

  <!-- Magnétron (couplé ~30° du N₁) -->
  <rect x="212" y="199" width="18" height="12" rx="2" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="233" y="199" font-size="8" fill="#b91c1c" font-weight="bold">⊕ mag</text>

  <!-- CÔTÉ B -->
  <text x="420" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">CÔTÉ B</text>

  <!-- Contrepoids (droite) -->
  <rect x="370" y="240" width="100" height="80" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="420" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Contrepoids</text>
  <text x="420" y="295" text-anchor="middle" font-size="10" fill="#991b1b">~ 10 kg</text>

  <!-- Miroir -->
  <rect x="310" y="270" width="14" height="8" rx="1" fill="#fbbf24" stroke="#a16207" stroke-width="1.5" transform="rotate(45, 317, 274)"/>
  <text x="305" y="262" font-size="8" fill="#a16207" font-weight="bold">[M]</text>

  <!-- Laser (fixé sur paroi du baril) -->
  <rect x="65" y="430" width="48" height="18" rx="4" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <text x="89" y="443" text-anchor="middle" font-size="8" font-weight="bold" fill="white">Laser</text>
  <line x1="89" y1="430" x2="313" y2="278" stroke="#f97316" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- PSD (fixé sur paroi du baril) -->
  <rect x="490" y="430" width="42" height="18" rx="4" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <text x="511" y="443" text-anchor="middle" font-size="8" font-weight="bold" fill="white">PSD</text>
  <line x1="321" y1="276" x2="490" y2="439" stroke="#f97316" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- Cote dégagement 90 mm -->
  <g font-size="9" fill="#64748b">
    <text x="305" y="175" text-anchor="middle">90 mm</text>
    <text x="305" y="186" text-anchor="middle" font-size="8">dégagement</text>
    <text x="305" y="395" text-anchor="middle">90 mm</text>
    <text x="305" y="406" text-anchor="middle" font-size="8">dégagement</text>
  </g>

  <!-- Légende -->
  <rect x="100" y="495" width="400" height="55" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="512" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">Légende</text>
  <circle cx="140" cy="530" r="6" fill="#22c55e" stroke="#15803d" stroke-width="1"/>
  <text x="155" y="534" font-size="9" fill="#1e293b">Nₖ = tube IN-13 (45°)</text>
  <rect x="255" y="524" width="12" height="10" rx="1" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
  <text x="275" y="534" font-size="9" fill="#1e293b">⊕ = magnétron</text>
  <circle cx="380" cy="530" r="4" fill="#a16207"/>
  <text x="390" y="534" font-size="9" fill="#1e293b">● = axe torsion</text>
  <rect x="445" y="525" width="10" height="8" rx="1" fill="#fbbf24" stroke="#a16207" stroke-width="1"/>
  <text x="462" y="534" font-size="9" fill="#1e293b">[M] = miroir</text>
</svg>
